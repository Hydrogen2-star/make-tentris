
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUM 10 CHAIN</title>
<style>
:root{--bg:#101522;--line:#35425c;--cyan:#50e7ff;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;color:#f3f6ff;background:radial-gradient(ellipse at 50% 30%,#24314d,#101522 70%);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}
header{width:100%;text-align:center;padding:8px 0 4px;flex-shrink:0}
h1{font-size:clamp(18px,4vw,28px);margin:0;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 16px #50e7ff55}
.subtitle{font-size:10px;color:#9eabc5;letter-spacing:2px}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,20px);width:100%;padding:5px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(66px,17vw,120px);flex-shrink:0}
.panel{width:100%;padding:7px 4px;border:1px solid var(--line);background:#182033dd;border-radius:10px;text-align:center}
.panel-title{font-size:10px;letter-spacing:1px;color:#a9b7d3;margin-bottom:4px}
.score{font-size:clamp(16px,4vw,23px);font-weight:800}
.small{font-size:10px;color:#a9b7d3}
#board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(10,1fr);gap:3px;height:min(68dvh,650px);width:min(42vw,300px,calc(68dvh * .43));aspect-ratio:4/10;padding:4px;flex-shrink:0;background:#080d18;border:2px solid #53627e;border-radius:9px;box-shadow:0 0 28px #0008,inset 0 0 20px #0008;overflow:hidden}
.cell{min-width:0;min-height:0;border-radius:4px;background:#1b2538;border:1px solid #29364d;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.5vw,23px);font-weight:900;position:relative}
.n1{background:#216a91;color:white}.n2{background:#287fba;color:white}.n3{background:#267fa0;color:white}.n4{background:#367b73;color:white}.n5{background:#588348;color:white}.n6{background:#9b9239;color:white}.n7{background:#b77932;color:white}.n8{background:#b45b48;color:white}.n9{background:#a94a6c;color:white}
.active{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;border-radius:5px;border:2px solid #ffffffd9;font-size:clamp(12px,3.5vw,23px);font-weight:950;color:white;box-shadow:0 0 14px #ffffff55;pointer-events:none;transition:top .04s linear,left .04s linear}
.gauge-shell{width:100%;height:160px;border:2px solid #3c4962;background:#080d18;border-radius:8px;padding:4px;display:flex;flex-direction:column-reverse;overflow:hidden}
#gaugeFill{width:100%;height:0%;background:linear-gradient(to top,#2786ff,#43eaff,#fff);border-radius:4px;transition:height .2s}
.gauge-shell.ready{border-color:#ffe37d;box-shadow:0 0 18px #ffd16699;animation:pulse .7s infinite alternate}
.gauge-shell.ready #gaugeFill{background:linear-gradient(to top,#ff8c32,#ffe66d,#fff)}
@keyframes pulse{to{box-shadow:0 0 22px #ffd166dd}}
#chargeText{font-size:12px;font-weight:800;margin-top:4px}
#readyText{font-size:10px;color:#8492ac;min-height:15px}
#readyText.ready{color:var(--gold);font-weight:900}
#combo{position:absolute;z-index:20;top:34%;left:50%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;white-space:nowrap;font-size:clamp(26px,7vw,48px);font-weight:1000;font-style:italic;color:#ffe56f;-webkit-text-stroke:1px #ff842b;text-shadow:0 0 12px #ffad32,0 4px 0 #9e421d}
#combo.show{animation:comboPop .85s ease-out forwards}
#judgement{position:absolute;z-index:25;left:50%;top:52%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;text-align:center;white-space:nowrap;font-weight:1000;text-shadow:0 3px 0 #172033,0 0 18px #fff}
#judgement.show{animation:judgePop 1.05s ease-out forwards}
#judgement .judge-number{display:block;font-size:clamp(42px,11vw,72px);line-height:1;color:#ffe66d;-webkit-text-stroke:2px #9b4b22}
#judgement .judge-word{display:block;font-size:clamp(22px,6vw,38px);color:#fff}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-10deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(4deg)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%) scale(.85)}}
.mode-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.mode-buttons button{min-width:115px;padding:11px 14px;font-size:14px}
#normalModeBtn{border-color:#50e7ff;color:#50e7ff}
#challengeModeBtn{border-color:#ffbd59;color:#ffcf78}
#modeSelectBtn{display:none;margin-top:8px}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-9deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(3deg)}38%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
#board.shake{animation:shake .28s linear}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.cell.clearing{animation:clearCell .28s ease-out forwards}
@keyframes clearCell{45%{filter:brightness(3);transform:scale(1.12)}100%{opacity:0;transform:scale(.1)}}
.cell.blast{animation:blastCell .42s ease-out forwards}
@keyframes blastCell{30%{filter:brightness(4) saturate(0);background:white;transform:scale(1.08)}100%{filter:brightness(1.6)}}
#explosionFX{position:absolute;inset:0;z-index:10;pointer-events:none}
.blast-ring{position:absolute;width:20px;height:20px;border:4px solid #fff6a1;border-radius:50%;box-shadow:0 0 20px #ff9d35;transform:translate(-50%,-50%) scale(.2);animation:ring .48s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(8);opacity:0}}
footer{flex-shrink:0;width:100%;padding:4px 8px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:5px}
.controls{display:flex;gap:6px;justify-content:center;width:100%}
button{border:1px solid #465570;border-radius:9px;background:#202c42;color:white;font-size:12px;font-weight:800;padding:8px 10px;min-width:44px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button:disabled{opacity:.35}
#blastBtn{min-width:120px;background:#242b3a;color:#78849a;border:2px solid #39445a;font-size:13px}
#blastBtn.ready{background:linear-gradient(135deg,#ff8b32,#ffd85d);color:#301707;border-color:#fff0a3;box-shadow:0 0 20px #ffb13c99;animation:pulse .7s infinite alternate}
#holdBtn{color:#80eaff}
#message{font-size:11px;color:#b5c3dd;min-height:14px;text-align:center}
#overlay{position:fixed;inset:0;z-index:50;background:#070b14ef;display:flex;align-items:center;justify-content:center;padding:20px}
#overlay.hidden{display:none}
.modal{width:min(330px,100%);border:1px solid #4a5d7b;border-radius:16px;background:#182236;padding:22px;text-align:center}
.modal h2{margin:0 0 10px;color:var(--cyan)}
.modal p{font-size:13px;line-height:1.8;color:#c0cce0}
@media(max-height:600px){header{padding:3px 0}.subtitle{display:none}#board{height:65dvh;width:min(38vw,calc(65dvh * .43))}.gauge-shell{height:105px}.side{gap:4px}.panel{padding:4px 3px}footer{gap:3px;padding-top:2px}button{padding:6px 8px}}
</style>
</head>
<body>
<header>
<h1>SUM 10 <span style="color:white">CHAIN</span></h1>
<div class="subtitle">CONNECT · CLEAR · CHAIN · EXPLODE</div>
</header>
<main>
<aside class="side">
<div class="panel"><div class="panel-title">SCORE</div><div class="score" id="score">0</div></div>
<div class="panel"><div class="panel-title">BEST</div><div class="score" id="best" style="font-size:17px">0</div></div>
<div class="panel"><div class="panel-title">HOLD</div><div id="holdDisplay" class="score">—</div><button id="holdBtn">HOLD</button></div>
<div class="panel">
<div class="panel-title">POWER</div>
<div class="gauge-shell" id="gaugeShell"><div id="gaugeFill"></div></div>
<div id="chargeText">0%</div><div id="readyText">CHARGING...</div>
</div>
</aside>
<div id="board"><div id="explosionFX"></div><div id="combo"></div><div id="judgement"></div></div>
<aside class="side">
<div class="panel"><div class="panel-title">NEXT</div><div id="nextDisplay" style="display:flex;flex-direction:column;gap:5px"></div></div>
<div class="panel"><div class="panel-title">MAX COMBO</div><div id="chainDisplay" class="score">0</div></div>
<div class="panel"><div class="panel-title">RANKING</div><ol id="rankList" style="padding-left:20px;margin:0;font-size:11px"></ol></div>
</aside>
</main>
<footer>
<div id="message">合計10を作って連鎖を狙おう！</div>
<div class="controls">
<button id="leftBtn">◀</button><button id="downBtn">▼</button><button id="rightBtn">▶</button><button id="blastBtn" disabled>✦ 爆発 [ENTER]</button>
</div>
<div class="controls"><button id="startBtn">START / RESTART</button><button id="pauseBtn">PAUSE</button></div>
</footer>
<div id="overlay"><div class="modal">
<h2 id="overlayTitle">SUM CHAIN</h2>
<p id="overlayText">プレイするモードを選んでね。<br>スペースキーで一気に落下。</p>
<div class="mode-buttons" id="modeButtons"><button id="normalModeBtn">NORMAL</button><button id="challengeModeBtn">CHALLENGE</button></div>
<button id="overlayBtn" style="display:none">もう一度プレイ</button><button id="modeSelectBtn">モード選択へ</button>
</div></div>

<script>
(()=>{
"use strict";
const W=4,H=10,$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const boardEl=$("board"),cells=[],board=Array.from({length:H},()=>Array(W).fill(0));
let piece=null,hold=null,holdUsed=false,queue=[],score=0,best=0;
let selectedMode="normal";
let running=false,paused=false,gameOver=false,resolving=false;
let lockTimer=0,lastTime=0,fallTimer=0,fallInterval=750,charge=0,maxCombo=0;
let messageTimer=null,blastCells=new Set(),clearCells=new Set(),audioCtx=null;
const CHARGE_MAX=100,LOCK_DELAY=600,TIME_CHARGE_PER_SECOND=.02;
const CLEAR_ANIMATION=280,FALL_ANIMATION=230;

for(let y=0;y<H;y++)for(let x=0;x<W;x++){
 const el=document.createElement("div");el.className="cell";el.dataset.x=x;el.dataset.y=y;
 boardEl.appendChild(el);cells.push(el);
}
const activeEl=document.createElement("div");activeEl.className="active";activeEl.style.display="none";boardEl.appendChild(activeEl);

// モード別の出現確率
function randomNumber(){
 const values=[1,2,3,4,5,6,7,8,9];
 const weights=selectedMode==="challenge"?[1,1,1,1,1,1,1,1,1]:[6,10,13,14,14,14,13,10,6];
 let r=Math.random()*weights.reduce((a,b)=>a+b,0);
 for(let i=0;i<values.length;i++){r-=weights[i];if(r<0)return values[i]}
 return 1;
}
function ensureQueue(){while(queue.length<3)queue.push(randomNumber())}
function spawnPiece(){
 ensureQueue();piece={x:1,y:0,value:queue.shift()};ensureQueue();
 holdUsed=false;lockTimer=0;fallTimer=0;
 if(board[0][piece.x]!==0){
  const x=[0,1,2,3].find(x=>board[0][x]===0);
  if(x!==undefined)piece.x=x;else{endGame();return}
 }
 render();
}
function render(){
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const el=cells[y*W+x],v=board[y][x],key=`${x},${y}`;
  el.className="cell";el.textContent=v||"";
  if(v)el.classList.add("n"+v);
  if(clearCells.has(key))el.classList.add("clearing");
  if(blastCells.has(key))el.classList.add("blast");
 }
 if(piece&&!gameOver){
  activeEl.style.display="flex";activeEl.style.left=`${piece.x*25}%`;
  activeEl.style.top=`${piece.y*10}%`;activeEl.style.width="25%";
  activeEl.style.height="10%";activeEl.className="active n"+piece.value;
  activeEl.textContent=piece.value;
 }else activeEl.style.display="none";
 $("score").textContent=score.toLocaleString();$("best").textContent=best.toLocaleString();
 $("holdDisplay").textContent=hold??"—";
 $("holdBtn").disabled=!running||paused||resolving||holdUsed||!piece;
 $("nextDisplay").innerHTML=queue.slice(0,3).map(v=>`<div class="score" style="font-size:19px">${v}</div>`).join("");
 updateGauge();renderRanking();
}
function updateGauge(){
 const pct=Math.min(100,charge),ready=charge>=CHARGE_MAX;
 $("gaugeFill").style.height=pct+"%";$("chargeText").textContent=Math.floor(pct)+"%";
 $("gaugeShell").classList.toggle("ready",ready);$("blastBtn").classList.toggle("ready",ready);
 $("blastBtn").disabled=!ready||!running||paused||resolving||!piece;
 $("readyText").textContent=ready?"READY!":"CHARGING...";
 $("readyText").classList.toggle("ready",ready);
}
function setMessage(text,ms=1500){
 $("message").textContent=text;if(messageTimer)clearTimeout(messageTimer);
 if(ms)messageTimer=setTimeout(()=>{if(running&&!paused)$("message").textContent=selectedMode==="challenge"?"合計20〜90を狙って高得点！":"合計10を作って連鎖を狙おう！"},ms);
}
function canMove(x,y){return x>=0&&x<W&&y>=0&&y<H&&board[y][x]===0}
function move(dx,dy){
 if(!running||paused||resolving||!piece)return;
 const nx=piece.x+dx,ny=piece.y+dy;
 if(canMove(nx,ny)){piece.x=nx;piece.y=ny;lockTimer=0;fallTimer=0;render()}
 else if(dy===1)lockTimer=Math.max(lockTimer,1);
}
function holdPiece(){
 if(!running||paused||resolving||!piece||holdUsed)return;
 const current=piece.value;
 if(hold===null){hold=current;spawnPiece()}else{piece.value=hold;hold=current}
 holdUsed=true;lockTimer=0;render();
}
function compactBoard(){
 for(let x=0;x<W;x++){
  let write=H-1;
  for(let y=H-1;y>=0;y--)if(board[y][x]!==0){
   const v=board[y][x];board[y][x]=0;board[write][x]=v;write--;
  }
  for(let y=write;y>=0;y--)board[y][x]=0;
 }
}

// モードごとに許可された合計だけを消去対象にする
function findAllMatches(){
 const matched=new Set();let biggestTarget=0;
 const allowedTargets=selectedMode==="challenge"?[10,30,50,70,90]:[10];
 const addSegment=(coords,sum)=>{
  if(coords.length<2||!allowedTargets.includes(sum))return;
  biggestTarget=Math.max(biggestTarget,sum);
  for(const [x,y] of coords)matched.add(`${x},${y}`);
 };
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  if(!board[y][x])continue;
  let sum=0,coords=[];
  for(let xx=x;xx<W;xx++){
   if(!board[y][xx])break;
   sum+=board[y][xx];coords.push([xx,y]);addSegment(coords,sum);
   if(sum>90)break;
  }
 }
 for(let x=0;x<W;x++)for(let y=0;y<H;y++){
  if(!board[y][x])continue;
  let sum=0,coords=[];
  for(let yy=y;yy<H;yy++){
   if(!board[yy][x])break;
   sum+=board[yy][x];coords.push([x,yy]);addSegment(coords,sum);
   if(sum>90)break;
  }
 }
 return {cells:[...matched].map(k=>k.split(",").map(Number)),target:biggestTarget};
}
function addCharge(combo){charge=Math.min(CHARGE_MAX,charge+2.5*combo*combo);updateGauge()}
function showCombo(n){
 if(n<2)return;
 const el=$("combo");el.textContent=`${n} COMBO!`;
 el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
 setMessage(`${n}コンボ！ CHAIN BONUS ×${n}`,1000);
}
function playTone(freq,duration,type="sine",volume=.04,delay=0){
 try{
  audioCtx ||=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);
  gain.gain.setValueAtTime(volume,audioCtx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+duration);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+duration);
 }catch(e){}
}
function playClearSound(combo){
 playTone(450+combo*110,.12,"triangle",.035);
 playTone(700+combo*150,.16,"sine",.025,.06);
}
const JUDGEMENTS={10:"Good",30:"Great",50:"Excellent",70:"Wonderful",90:"Perfect"};
function showJudgement(target){
 const word=JUDGEMENTS[target];
 if(!word)return;
 const el=$("judgement");el.innerHTML=`<span class="judge-number">${target}</span><span class="judge-word">${word}</span>`;
 el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
}
function playJudgementSound(target){
 const level=Math.max(2,Math.min(9,target/10)),base=300+level*45;
 playTone(base,.16,"triangle",.055);
 playTone(base*1.25,.2,"sine",.045,.07);
 playTone(base*1.5,.28,"sine",.035,.14);
 if(level>=6)playTone(base*2,.32,"triangle",.025,.2);
}
function playExplosionSound(){
 playTone(100,.45,"sawtooth",.09);playTone(260,.35,"triangle",.06,.03);
 playTone(680,.22,"square",.025,.08);
}
function clearAnimation(group){clearCells=new Set(group.map(([x,y])=>`${x},${y}`));render()}
async function resolveClears(){
 if(resolving)return;
 resolving=true;let combo=0,totalCleared=0;
 try{
  while(true){
   const match=findAllMatches(),group=match.cells;if(group.length===0)break;
   combo++;maxCombo=Math.max(maxCombo,combo);$("chainDisplay").textContent=maxCombo;
   clearAnimation(group);if(combo>=2)showCombo(combo);
   if(selectedMode==="challenge"&&JUDGEMENTS[match.target]){showJudgement(match.target);playJudgementSound(match.target)}
   else playClearSound(combo);
   await sleep(CLEAR_ANIMATION);
   let clearedValue=0;for(const [x,y] of group){clearedValue+=board[y][x];board[y][x]=0}
   clearCells.clear();totalCleared+=group.length;
   if(selectedMode==="challenge")score+=clearedValue*10*combo;
   else score+=group.length*10*combo;
   addCharge(combo);
   compactBoard();render();await sleep(FALL_ANIMATION);
  }
  if(totalCleared>0){
   score+=totalCleared*5;render();
   setMessage(combo>=2?`${combo}コンボ達成！ +${totalCleared*5} BONUS`:`${totalCleared}マス消去！`);
  }
 }finally{clearCells.clear();resolving=false;render()}
}
async function lockPiece(){
 if(!piece||resolving||!running||paused)return;
 const {x,y,value}=piece;
 if(y<0||board[y][x]!==0){endGame();return}
 board[y][x]=value;piece=null;lockTimer=0;render();
 await resolveClears();
 if(!running||gameOver)return;
 if(board[0].some(v=>v!==0)){endGame();return}
 spawnPiece();
}
function explosionShape(cx,cy){
 return [[cx-1,cy-1],[cx,cy-1],[cx+1,cy-1],[cx-1,cy],[cx+1,cy],
 [cx-1,cy+1],[cx,cy+1],[cx+1,cy+1],[cx,cy-2],[cx,cy+2],[cx-2,cy],[cx+2,cy]]
 .filter(([x,y])=>x>=0&&x<W&&y>=0&&y<H);
}
async function explode(){
 if(!running||paused||resolving||!piece||charge<CHARGE_MAX)return;
 resolving=true;charge=0;updateGauge();
 const cx=piece.x,cy=piece.y,targets=explosionShape(cx,cy);
 blastCells=new Set(targets.map(([x,y])=>`${x},${y}`));
 const fx=$("explosionFX");fx.innerHTML="";
 const ring=document.createElement("div");ring.className="blast-ring";
 ring.style.left=`${(cx+.5)/W*100}%`;ring.style.top=`${(cy+.5)/H*100}%`;fx.appendChild(ring);
 boardEl.classList.remove("shake");void boardEl.offsetWidth;boardEl.classList.add("shake");
 playExplosionSound();setMessage("✦ POWER EXPLOSION!!",1200);render();await sleep(430);
 let removed=0;
 for(const [x,y] of targets)if(board[y][x]!==0){board[y][x]=0;removed++}
 blastCells.clear();fx.innerHTML="";compactBoard();
 while(piece&&piece.y>0&&board[piece.y][piece.x]!==0)piece.y--;
 if(piece&&board[piece.y][piece.x]!==0){resolving=false;endGame();return}
 score+=removed*15;render();await sleep(FALL_ANIMATION);resolving=false;
 await resolveClears();
 if(running&&!gameOver){
  if(board[0].some(v=>v!==0)){endGame();return}
  setMessage(`爆発！ ${removed}マスを消去`);render();
 }
}
function startGame(mode=selectedMode){
 selectedMode=mode;
 $("subtitle").textContent=selectedMode==="challenge"?"CHALLENGE · SUM 10 / 30 / 50 / 70 / 90 · BIGGER SUM, BIGGER SCORE":"NORMAL · SUM 10 · CONNECT · CLEAR · CHAIN";
 renderRanking();
 $("overlay").classList.add("hidden");$("modeButtons").style.display="none";$("overlayBtn").style.display="none";$("modeSelectBtn").style.display="none";
 init();running=true;paused=false;gameOver=false;
 lastTime=performance.now();spawnPiece();setMessage("ゲーム開始！");requestAnimationFrame(loop);
}
function init(){
 for(let y=0;y<H;y++)board[y].fill(0);
 piece=null;hold=null;holdUsed=false;queue=[];score=0;charge=0;maxCombo=0;
 fallTimer=0;lockTimer=0;fallInterval=750;resolving=false;
 clearCells.clear();blastCells.clear();gameOver=false;$("chainDisplay").textContent="0";render();
}
function endGame(){
 running=false;paused=false;gameOver=true;piece=null;best=Math.max(best,score);saveRanking(score,selectedMode);render();
 $("overlayTitle").textContent="GAME OVER";
 $("overlayText").innerHTML=`${selectedMode==="challenge"?"CHALLENGE":"NORMAL"}<br>SCORE: <b>${score.toLocaleString()}</b><br>最高コンボ: <b>${maxCombo}</b>`;
 $("modeButtons").style.display="none";$("overlayBtn").style.display="inline-block";$("overlayBtn").textContent="同じモードでもう一度";
 $("modeSelectBtn").style.display="inline-block";$("overlay").classList.remove("hidden");
}
function togglePause(){
 if(!running||gameOver||resolving)return;
 paused=!paused;$("pauseBtn").textContent=paused?"RESUME":"PAUSE";
 setMessage(paused?"一時停止中":"再開！");
 if(!paused){lastTime=performance.now();requestAnimationFrame(loop)}
}
function loop(now){
 if(!running||paused||gameOver)return;
 const dt=Math.min(now-lastTime,100);lastTime=now;
 if(!resolving&&piece){
  charge=Math.min(CHARGE_MAX,charge+TIME_CHARGE_PER_SECOND*dt/1000);
  fallTimer+=dt;
  // 50点ごとに加速。終盤は最低80ms間隔まで速くなる
  const level=Math.floor(score/50);
  fallInterval=Math.max(80,750*Math.pow(.90,level));
  if(fallTimer>=fallInterval){
   fallTimer=0;
   if(canMove(piece.x,piece.y+1)){piece.y++;lockTimer=0}
   else{lockTimer+=dt;if(lockTimer>=LOCK_DELAY)lockPiece()}
  }else if(!canMove(piece.x,piece.y+1)){
   lockTimer+=dt;if(lockTimer>=LOCK_DELAY)lockPiece();
  }else lockTimer=0;
  render();
 }
 requestAnimationFrame(loop);
}
function hardDrop(){
 if(!running||paused||resolving||!piece)return;
 while(canMove(piece.x,piece.y+1))piece.y++;
 render();
 lockPiece();
}
function saveRanking(s,mode){
 try{
  const key=`sum10chain-ranks-${mode}`;
  const oldScores=mode==="normal"?JSON.parse(localStorage.getItem("sum10chain-ranks")||"[]"):[];
  const scores=JSON.parse(localStorage.getItem(key)||JSON.stringify(oldScores));
  scores.push(s);scores.sort((a,b)=>b-a);
  localStorage.setItem(key,JSON.stringify(scores.slice(0,5)));
 }catch(e){}
}
function renderRanking(){
 let scores=[];try{
  const saved=localStorage.getItem(`sum10chain-ranks-${selectedMode}`);
  scores=JSON.parse(saved||(selectedMode==="normal"?localStorage.getItem("sum10chain-ranks"):"[]")||"[]");
 }catch(e){}
 $("rankList").innerHTML="";
 if(!scores.length){$("rankList").innerHTML="<li>—</li>";return}
 scores.slice(0,5).forEach(s=>{
  const li=document.createElement("li");li.textContent=s.toLocaleString();$("rankList").appendChild(li);
 });
}
$("leftBtn").addEventListener("click",()=>move(-1,0));
$("rightBtn").addEventListener("click",()=>move(1,0));
$("downBtn").addEventListener("click",()=>{
 if(!running||paused||resolving||!piece)return;
 if(canMove(piece.x,piece.y+1)){piece.y++;lockTimer=0;fallTimer=0;render()}
 else lockTimer=Math.max(lockTimer,1);
});
$("holdBtn").addEventListener("click",holdPiece);
$("blastBtn").addEventListener("click",explode);
$("startBtn").addEventListener("click",()=>startGame(selectedMode));
$("pauseBtn").addEventListener("click",togglePause);
$("overlayBtn").addEventListener("click",()=>startGame(selectedMode));
$("normalModeBtn").addEventListener("click",()=>startGame("normal"));
$("challengeModeBtn").addEventListener("click",()=>startGame("challenge"));
$("modeSelectBtn").addEventListener("click",()=>{
 running=false;paused=false;piece=null;selectedMode="normal";
 $("overlayTitle").textContent="SUM CHAIN";
 $("overlayText").innerHTML="プレイするモードを選んでね。<br>スペースキーで一気に落下。";
 $("modeButtons").style.display="flex";$("overlayBtn").style.display="none";$("modeSelectBtn").style.display="none";
 $("overlay").classList.remove("hidden");render();
});
document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowDown","Enter"," "].includes(e.key))e.preventDefault();
 if(e.repeat&&["Enter"," ","c","C"].includes(e.key))return;
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")move(-1,0);
 else if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")move(1,0);
 else if(e.key==="ArrowDown"||e.key==="s"||e.key==="S"){
  if(running&&!paused&&!resolving&&piece&&canMove(piece.x,piece.y+1)){
   piece.y++;lockTimer=0;fallTimer=0;render();
  }
 }else if(e.key==="c"||e.key==="C"||e.key==="Shift")holdPiece();
 else if(e.key==="Enter"){if(running&&!paused&&charge>=CHARGE_MAX)explode()}
 else if(e.code==="Space"){hardDrop()}
 else if(e.key==="Escape"||e.key==="p"||e.key==="P")togglePause();
});
for(const [id,dx] of [["leftBtn",-1],["rightBtn",1]]){
 let repeatId;const btn=$(id);
 btn.addEventListener("pointerdown",()=>{repeatId=setInterval(()=>move(dx,0),130)});
 for(const ev of ["pointerup","pointerleave","pointercancel"])btn.addEventListener(ev,()=>clearInterval(repeatId));
}
render();
})();
</script>
</body>
</html>
