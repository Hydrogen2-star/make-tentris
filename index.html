
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAKE 10 TETRIS</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#10131e;color:#f4f6ff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;align-items:center;
}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid white;outline-offset:2px}
.app{
  width:min(760px,100%);
  height:100dvh;max-height:100dvh;
  padding:clamp(5px,1.2vh,12px);
  display:flex;flex-direction:column;gap:clamp(4px,0.8vh,9px);
  overflow:hidden;
}
header{text-align:center;flex-shrink:0}
h1{font-size:clamp(19px,3.5vh,32px);letter-spacing:2px;margin:0}
.subtitle{color:#9da8c7;font-size:clamp(9px,1.5vh,12px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex-shrink:0}
.stat{background:#1b2031;border:1px solid #303951;border-radius:9px;padding:4px;text-align:center}
.stat span{display:block;color:#9da8c7;font-size:clamp(8px,1.3vh,11px)}
.stat strong{font-size:clamp(14px,2.5vh,22px);font-variant-numeric:tabular-nums}
.layout{
  display:grid;grid-template-columns:minmax(0,1fr) clamp(100px,22%,150px);
  gap:clamp(5px,1.3vw,12px);flex:1;min-height:0;overflow:hidden;
}
.game-area{min-width:0;min-height:0;display:flex;flex-direction:column;gap:5px}
.board-wrap{
  flex:1;min-height:0;display:flex;justify-content:center;align-items:center;
  background:#0b0e17;border:2px solid #303951;border-radius:10px;padding:4px;
  overflow:hidden;
}
#board{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(10,minmax(0,1fr));
  gap:clamp(2px,0.45vh,4px);
  width:min(100%,calc((100dvh - 150px)*0.4));
  height:100%;max-height:100%;
}
.cell{
  min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;
  border-radius:4px;background:#1b2031;border:1px solid #282f44;
  font-size:clamp(12px,2.7vh,23px);font-weight:800;
  font-variant-numeric:tabular-nums;
}
.cell.filled{color:#10131e;border:none;box-shadow:inset 0 -2px #0002}
.cell.active{outline:2px solid #fff;outline-offset:-3px}
.side{min-height:0;display:flex;flex-direction:column;gap:clamp(4px,0.8vh,8px);overflow:hidden}
.panel{background:#1b2031;border:1px solid #303951;border-radius:9px;padding:clamp(5px,1vh,10px);flex-shrink:0}
.panel h2{font-size:clamp(9px,1.4vh,12px);color:#9da8c7;letter-spacing:1px;margin:0 0 5px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.mini-cell{aspect-ratio:1;min-width:0;border-radius:3px;background:#0f1320;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(9px,1.8vh,14px)}
#holdStatus{font-size:clamp(7px,1.1vh,10px);color:#9da8c7;margin-top:4px}
.next-item{margin-bottom:5px}
.next-item:last-child{margin-bottom:0}
.next-label{font-size:clamp(8px,1.2vh,10px);color:#9da8c7;margin-bottom:3px}
.controls{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.btn{border:1px solid #3a4560;background:#252d43;color:#f4f6ff;padding:clamp(5px,0.9vh,9px) 4px;border-radius:7px;font-size:clamp(10px,1.5vh,13px);font-weight:700}
.btn:hover{background:#343f5b}
.btn.primary{background:#7964f4;border-color:#7964f4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.help{font-size:clamp(8px,1.25vh,11px);line-height:1.55;color:#aab4ce;overflow:hidden}
.help strong{color:#f4f6ff}
#message{flex-shrink:0;min-height:0;background:#1b2031;border:1px solid #303951;border-radius:7px;padding:6px;text-align:center;font-size:clamp(9px,1.4vh,12px);color:#c9d1e9}
#message.good{color:#74f0b0}
#message.bad{color:#ff9ca7}
.footer{font-size:clamp(8px,1.2vh,10px);color:#7e89a8;text-align:center;flex-shrink:0}
.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:4px;flex-shrink:0}
.mobile-controls button{padding:5px 0}
@media(max-width:520px){
 .layout{grid-template-columns:minmax(0,1fr) clamp(90px,25%,115px)}
 .help{line-height:1.4}
}
@media(max-height:520px){
 .subtitle{display:none}
 .app{gap:3px}
 .panel{padding:4px}
 .help{font-size:8px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MAKE 10 <span style="color:#8c7bff">TETRIS</span></h1>
    <div class="subtitle">積んで、つないで、10を作れ。</div>
  </header>

  <div class="stats">
    <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
    <div class="stat"><span>CHAIN BEST</span><strong id="bestChain">0</strong></div>
    <div class="stat"><span>LEVEL</span><strong id="level">1</strong></div>
  </div>

  <div class="layout">
    <div class="game-area">
      <div class="board-wrap">
        <div id="board" aria-label="4列10行のゲーム盤"></div>
      </div>
      <div class="mobile-controls">
        <button class="btn" id="leftBtn">←</button>
        <button class="btn" id="rightBtn">→</button>
        <button class="btn" id="downBtn">↓</button>
        <button class="btn" id="dropBtn">DROP</button>
      </div>
      <div id="message">スタートを押してゲーム開始！</div>
    </div>

    <aside class="side">
      <div class="panel">
        <h2>HOLD</h2>
        <div id="holdGrid" class="mini-grid"></div>
        <div id="holdStatus">HOLD AVAILABLE</div>
      </div>
      <div class="panel">
        <h2>NEXT</h2>
        <div id="nextList"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="startBtn">ゲーム開始</button>
        <button class="btn" id="holdBtn">HOLD [C]</button>
        <button class="btn" id="pauseBtn" disabled>一時停止 [P]</button>
        <button class="btn" id="restartBtn">リスタート</button>
      </div>
      <div class="panel help">
        <h2>RULES</h2>
        <strong>合計10で消去！</strong><br>
        縦・横の連続した数字の合計が10なら消える。<br>
        <br><strong>連鎖ボーナス</strong><br>
        連続消去で得点アップ！<br>
        <br><strong>GAME OVER</strong><br>
        どれかの列が10マス埋まると終了。
      </div>
    </aside>
  </div>
  <div class="footer">← → 移動 / ↓ 高速落下 / SPACE 一気に落下 / C HOLD / P 一時停止</div>
</div>

<script>
"use strict";

const W=4,H=10;
const COLORS={
  1:"#8de4ff",2:"#78c6ff",3:"#8c9bff",
  4:"#bd91ff",5:"#ed91ff",6:"#ff91c7",
  7:"#ffab91",8:"#ffd166",9:"#a9e66e"
};

const $=id=>document.getElementById(id);
const boardEl=$("board");
const holdGrid=$("holdGrid");
const nextList=$("nextList");

let board,current,queue,hold,holdUsed;
let score,level,bestChain,elapsed,chainCount;
let running=false,paused=false,gameOver=false;
let lastTime=0,dropCounter=0,rafId=0;

const cells=[];
for(let y=0;y<H;y++){
  cells[y]=[];
  for(let x=0;x<W;x++){
    const el=document.createElement("div");
    el.className="cell";
    boardEl.appendChild(el);
    cells[y][x]=el;
  }
}

function randomPiece(){
  return {value:1+Math.floor(Math.random()*9),x:1,y:0};
}
function makeEmptyBoard(){
  return Array.from({length:H},()=>Array(W).fill(0));
}
function setMessage(text,type=""){
  $("message").textContent=text;
  $("message").className=type;
}
function init(){
  cancelAnimationFrame(rafId);
  board=makeEmptyBoard();
  current=null;
  queue=[randomPiece(),randomPiece(),randomPiece()];
  hold=null;holdUsed=false;
  score=0;level=1;bestChain=0;elapsed=0;chainCount=0;
  running=false;paused=false;gameOver=false;
  lastTime=0;dropCounter=0;
  $("startBtn").disabled=false;
  $("startBtn").textContent="ゲーム開始";
  $("pauseBtn").disabled=true;
  $("pauseBtn").textContent="一時停止 [P]";
  setMessage("スタートを押してゲーム開始！");
  render();
}
function ensureQueue(){
  while(queue.length<3)queue.push(randomPiece());
}
function valid(x,y,value){
  return x>=0&&x<W&&y>=0&&y<H&&board[y][x]===0;
}
function spawnPiece(){
  ensureQueue();
  current=queue.shift();
  ensureQueue();
  current.x=1;current.y=0;
  holdUsed=false;
  if(!valid(current.x,current.y,current.value)){
    endGame();return;
  }
  render();
}
function move(dx,dy){
  if(!running||paused||gameOver||!current)return false;
  if(valid(current.x+dx,current.y+dy,current.value)){
    current.x+=dx;current.y+=dy;
    render();return true;
  }
  return false;
}
function holdPiece(){
  if(!running||paused||gameOver||!current||holdUsed)return;
  const old=hold;
  hold=current.value;
  holdUsed=true;
  if(old===null){
    spawnPiece();
    holdUsed=true;
  }else{
    current.value=old;
    current.x=1;current.y=0;
    if(!valid(current.x,current.y,current.value)){
      endGame();return;
    }
  }
  setMessage("ホールド！");
  render();
}
function lockPiece(){
  if(!current||gameOver)return;
  const {x,y,value}=current;
  if(!valid(x,y,value)){
    endGame();return;
  }
  board[y][x]=value;
  current=null;
  chainCount=0;
  resolveClears();
  if(!gameOver)spawnPiece();
}

/*
  すべての縦横の連続区間を調べる。
  合計が10になった区間を消去対象にする。
  1つの列・行に複数の区間がある場合も検出する。
*/
function findMatches(){
  const found=new Set();

  function scanLine(coords){
    for(let start=0;start<coords.length;start++){
      let sum=0;
      for(let end=start;end<coords.length;end++){
        const [y,x]=coords[end];
        const v=board[y][x];
        if(v===0)break;
        sum+=v;
        if(sum>10)break;
        if(sum===10){
          for(let i=start;i<=end;i++){
            found.add(coords[i].join(","));
          }
          // 数字は正なので、延長して10になることはない
          break;
        }
      }
    }
  }

  // 横方向
  for(let y=0;y<H;y++){
    scanLine(Array.from({length:W},(_,x)=>[y,x]));
  }
  // 縦方向
  for(let x=0;x<W;x++){
    scanLine(Array.from({length:H},(_,y)=>[y,x]));
  }

  return [...found].map(k=>k.split(",").map(Number));
}

function compactBoard(){
  for(let x=0;x<W;x++){
    let write=H-1;
    for(let y=H-1;y>=0;y--){
      if(board[y][x]!==0){
        board[write][x]=board[y][x];
        if(write!==y)board[y][x]=0;
        write--;
      }
    }
    for(let y=write;y>=0;y--)board[y][x]=0;
  }
}

function resolveClears(){
  let totalCleared=0;
  chainCount=0;

  // 消去→落下→再判定を繰り返して連鎖を処理
  while(chainCount<40){
    const matches=findMatches();
    if(matches.length===0)break;

    chainCount++;
    bestChain=Math.max(bestChain,chainCount);

    const unique=new Set(matches.map(([y,x])=>`${y},${x}`));
    const count=unique.size;
    totalCleared+=count;

    // 連鎖倍率：1連鎖×1、2連鎖×2、3連鎖×3……
    score+=count*100*chainCount;

    for(const key of unique){
      const [y,x]=key.split(",").map(Number);
      board[y][x]=0;
    }
    compactBoard();
  }

  if(totalCleared>0){
    setMessage(
      `${chainCount}連鎖！ ${totalCleared}マス消去！ +${score.toLocaleString()}点`,
      "good"
    );
  }
  updateStats();
}

function hardDrop(){
  if(!running||paused||gameOver||!current)return;
  let distance=0;
  while(valid(current.x,current.y+1,current.value)){
    current.y++;distance++;
  }
  score+=distance*2;
  lockPiece();
  updateStats();
}

function endGame(){
  gameOver=true;running=false;paused=false;current=null;
  $("pauseBtn").disabled=true;
  $("startBtn").disabled=false;
  $("startBtn").textContent="もう一度プレイ";
  setMessage(`GAME OVER — スコア ${score.toLocaleString()}点`,"bad");
  render();
}

function startGame(){
  if(gameOver)init();
  if(running&&!paused)return;
  running=true;paused=false;
  $("startBtn").disabled=true;
  $("pauseBtn").disabled=false;
  $("pauseBtn").textContent="一時停止 [P]";
  if(!current)spawnPiece();
  lastTime=performance.now();dropCounter=0;
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
  setMessage("ゲーム開始！ 連続する数字で10を作ろう。");
}

function togglePause(){
  if(!running||gameOver)return;
  paused=!paused;
  $("pauseBtn").textContent=paused?"再開 [P]":"一時停止 [P]";
  if(paused)setMessage("一時停止中");
  else{
    lastTime=performance.now();
    setMessage("ゲーム再開！");
    rafId=requestAnimationFrame(loop);
  }
}

function loop(now){
  if(!running||paused||gameOver)return;
  const dt=Math.min(now-lastTime,100);
  lastTime=now;
  elapsed+=dt;
  level=1+Math.floor(elapsed/20000);
  const interval=Math.max(120,850-(level-1)*65);
  dropCounter+=dt;
  if(dropCounter>=interval){
    dropCounter=0;
    if(!move(0,1))lockPiece();
  }
  updateStats();
  render();
  if(running&&!paused&&!gameOver)rafId=requestAnimationFrame(loop);
}

function updateStats(){
  $("score").textContent=score.toLocaleString();
  $("bestChain").textContent=bestChain;
  $("level").textContent=level;
}

function renderMini(container,value){
  container.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="mini-cell";
    if(value!==null&&i===1){
      d.textContent=value;
      d.style.background=COLORS[value];
      d.style.color="#10131e";
    }
    container.appendChild(d);
  }
}

function renderSide(){
  renderMini(holdGrid,hold);
  $("holdStatus").textContent=holdUsed?"HOLD USED":"HOLD AVAILABLE";
  nextList.innerHTML="";
  ensureQueue();
  queue.slice(0,3).forEach((p,i)=>{
    const item=document.createElement("div");
    item.className="next-item";
    const label=document.createElement("div");
    label.className="next-label";
    label.textContent=`NEXT ${i+1}`;
    const grid=document.createElement("div");
    grid.className="mini-grid";
    for(let j=0;j<4;j++){
      const d=document.createElement("div");
      d.className="mini-cell";
      if(j===1){
        d.textContent=p.value;
        d.style.background=COLORS[p.value];
        d.style.color="#10131e";
      }
      grid.appendChild(d);
    }
    item.append(label,grid);
    nextList.appendChild(item);
  });
}

function render(){
  if(!board)return;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const el=cells[y][x];
      let v=board[y][x];
      const active=current&&!gameOver&&current.x===x&&current.y===y;
      if(active)v=current.value;
      el.textContent=v||"";
      el.className="cell";
      el.style.background=v?COLORS[v]:"#1b2031";
      el.style.color=v?"#10131e":"";
      if(v)el.classList.add("filled");
      if(active)el.classList.add("active");
    }
  }
  updateStats();
  renderSide();
}

$("startBtn").addEventListener("click",startGame);
$("restartBtn").addEventListener("click",()=>{
  init();startGame();
});
$("pauseBtn").addEventListener("click",togglePause);
$("holdBtn").addEventListener("click",holdPiece);
$("leftBtn").addEventListener("click",()=>move(-1,0));
$("rightBtn").addEventListener("click",()=>move(1,0));
$("downBtn").addEventListener("click",()=>{
  if(move(0,1)){score++;updateStats();}
  else if(running&&!paused&&!gameOver)lockPiece();
});
$("dropBtn").addEventListener("click",hardDrop);

document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key))e.preventDefault();
  if(e.repeat&&["c","C","p","P"," "].includes(e.key))return;
  if(e.key==="Enter"&&!running&&!gameOver)startGame();
  if(e.key==="ArrowLeft")move(-1,0);
  if(e.key==="ArrowRight")move(1,0);
  if(e.key==="ArrowDown"){
    if(move(0,1)){score++;updateStats();}
    else if(running&&!paused&&!gameOver)lockPiece();
  }
  if(e.key===" ")hardDrop();
  if(e.key==="c"||e.key==="C")holdPiece();
  if(e.key==="p"||e.key==="P")togglePause();
});

init();
</script>
</body>
</html>
