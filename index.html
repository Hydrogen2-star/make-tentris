
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUM 10 CHAIN</title>
<style>
:root{--bg:#0b1220;--panel:#182236;--panel2:#202e49;--text:#edf4ff;--muted:#9aabc5;--cyan:#5ce6ff;--gold:#ffdc85;--red:#ff5c72;--blue:#6caaff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,#1b2d4b,#0b1220 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;overflow-x:hidden}
button{border:1px solid #536783;border-radius:9px;background:#263650;color:#fff;font-weight:800;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
header{text-align:center;padding:8px 10px 4px}
header h1{margin:0;font-size:clamp(22px,5vw,32px);letter-spacing:3px;color:var(--cyan);text-shadow:0 0 16px #5ce6ff66}
header p{margin:2px 0;color:var(--muted);font-size:10px;letter-spacing:2px}
#challengeTracker{display:none;width:min(560px,96vw);margin:4px auto 8px;padding:7px 10px;border:1px solid #526887;border-radius:10px;background:#101b2e}
.tracker-title{text-align:center;font-size:10px;letter-spacing:2px;color:#b8c9e4;margin-bottom:5px}
.tracker-numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.tracker-number{padding:5px 0;text-align:center;border-radius:5px;background:#26344b;color:#8294af;font-size:clamp(10px,2.5vw,14px);font-weight:900;border:1px solid #3b4d68}
.tracker-number.done{background:linear-gradient(135deg,#175f82,#167e91);color:#fff;border-color:#5ce6ff;box-shadow:0 0 9px #5ce6ff55}
.tracker-number.reached{animation:trackerPop .55s ease}
@keyframes trackerPop{50%{transform:scale(1.2);filter:brightness(1.8)}}
main{display:flex;justify-content:center;align-items:center;gap:clamp(8px,2vw,20px);padding:5px 8px}
.side{width:clamp(85px,18vw,150px);display:flex;flex-direction:column;gap:8px}
.panel{background:linear-gradient(145deg,#202e49,#151f32);border:1px solid #3c506f;border-radius:10px;padding:8px 5px;text-align:center;box-shadow:0 5px 15px #0003}
.panel .label{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:800}
.panel .value{font-size:clamp(16px,3.6vw,23px);font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
#board{position:relative;width:min(43vw,300px,calc(70dvh * .43));height:min(70dvh,620px);background:#101a2b;border:2px solid #526987;border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(10,1fr);gap:3px;padding:4px;box-shadow:0 12px 35px #0008;overflow:visible}
.cell{background:#1b2940;border-radius:4px;position:relative;min-width:0;min-height:0}
.cell.filled{background:linear-gradient(145deg,#2e6d91,#24476e);border:1px solid #72c8f4;box-shadow:inset 0 1px 3px #ffffff33}
.cell .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.5vw,23px);font-weight:1000;text-shadow:0 2px 4px #0008}
.cell.active{background:linear-gradient(145deg,#f0b94c,#d67d2e);border:1px solid #ffe4a3}
.cell.active .num{color:#fff}
.cell.clear{animation:clearCell .32s ease forwards}
@keyframes clearCell{to{transform:scale(1.35);opacity:0;filter:brightness(2)}}
#nextPieces{display:flex;justify-content:center;gap:4px;margin-top:4px}
.next-piece{width:22px;height:22px;border-radius:5px;background:#315477;display:grid;place-items:center;font-weight:900}
#powerPanel .value{color:var(--gold)}
.power-bar{height:6px;background:#0c1524;border-radius:8px;margin-top:5px;overflow:hidden}
#powerFill{height:100%;width:0;background:linear-gradient(90deg,#ffbd54,#fff19a);transition:width .2s}
footer{display:flex;flex-direction:column;align-items:center;gap:8px;padding:7px 10px 14px}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.controls button{min-width:56px;padding:10px 14px;font-size:17px}
#startBtn{min-width:180px;padding:11px 20px;background:linear-gradient(135deg,#176c89,#244d78);border-color:var(--cyan);font-size:14px}
#blastBtn{background:linear-gradient(135deg,#8d4d16,#b66a1c);border-color:#ffca65}
#message{height:20px;color:var(--gold);font-weight:900;font-size:14px;text-align:center}
#modeButtons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:15px}
#modeButtons button{padding:12px 14px;min-width:110px}
#modeButtons button:nth-child(2){border-color:#63d9ff}
#modeButtons button:nth-child(3){border-color:#ffb75c}
#modeButtons button:nth-child(4){border-color:#ff6683}
#overlay{position:fixed;inset:0;z-index:50;background:#070b14ef;display:flex;align-items:center;justify-content:center;padding:12px}
#overlay.hidden{display:none}
.modal{width:min(500px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;border:1px solid #4a5d7b;border-radius:18px;background:linear-gradient(160deg,#202e49,#151e30);padding:clamp(16px,4vw,26px);text-align:center;box-shadow:0 18px 60px #000b}
.modal h2{margin:0 0 10px;color:var(--cyan);font-size:clamp(23px,5vw,30px);letter-spacing:1px}
.modal p{font-size:clamp(13px,2.8vw,16px);line-height:1.8;color:#c0cce0;margin:8px 0 14px}
#resultRanking{display:none;margin:14px auto 16px;padding:12px 14px;max-width:360px;text-align:left;border:1px solid #526887;border-radius:12px;background:#0d1628}
#resultRanking.visible{display:block}
#resultRanking h3{margin:0 0 8px;text-align:center;font-size:14px;letter-spacing:2px;color:#ffdc85}
#resultRankList{margin:0;padding-left:28px;display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
#resultRankList li{padding:3px 5px;border-bottom:1px solid #2b3a53}
#resultRankList li.current-score{color:#ffe28a;background:#55432366;border-radius:5px}
#overlayBtn,#modeSelectBtn{padding:11px 16px;font-size:13px;margin:3px}
#overlayBtn{background:linear-gradient(135deg,#176c89,#244d78);border-color:#5ce6ff;color:#fff}
#modeSelectBtn{background:#28344b;border-color:#7385a5;color:#e5edff}
@media(max-height:650px){
 header{padding:2px 0}
 #board{height:58dvh;width:min(39vw,calc(58dvh * .43))}
 footer{gap:4px;padding-top:3px}
}
body.challenge-mode main{justify-content:center;gap:clamp(10px,3vw,28px)}
body.challenge-mode main>.side:first-child{width:clamp(76px,19vw,132px);gap:7px}
body.challenge-mode main>.side:last-child{display:none}
body.challenge-mode #powerPanel{display:none}
body.challenge-mode #board{height:min(61dvh,620px);width:min(43vw,300px,calc(61dvh * .43))}
body.challenge-mode #challengeTracker{display:block}
body.challenge-mode footer{gap:6px;padding-top:5px}
body.challenge-mode footer #message{display:none}
body.challenge-mode footer .controls:nth-of-type(2){gap:12px}
body.challenge-mode footer .controls:nth-of-type(2) button{min-width:clamp(58px,15vw,82px);font-size:18px;padding:10px 8px}
body.challenge-mode #startBtn{min-width:190px;padding:10px 20px;font-size:14px}
body.challenge-mode #blastBtn{display:none}
@media(max-height:650px){
 body.challenge-mode header{padding:2px 0}
 body.challenge-mode #challengeTracker{padding:3px 6px;margin:0 auto 2px}
 body.challenge-mode .tracker-title{margin-bottom:2px}
 body.challenge-mode main>.side:first-child{gap:4px}
 body.challenge-mode main>.side:first-child .panel{padding:5px 3px}
 body.challenge-mode #board{height:56dvh;width:min(39vw,calc(56dvh * .43))}
 body.challenge-mode footer{gap:3px;padding-top:2px}
 body.challenge-mode footer .controls:nth-of-type(2) button{padding:6px 8px}
}
@media(max-width:480px){
 main{gap:5px;padding:4px}
 .side{width:72px}
 .panel{padding:6px 3px}
 .panel .label{font-size:8px}
 #board{width:45vw;height:min(66dvh,600px)}
 #resultRankList{grid-template-columns:1fr}
 body.challenge-mode #board{width:45vw}
}
</style>
</head>
<body>
<header>
<h1>SUM 10 CHAIN</h1>
<p>FIND THE SUM. MAKE THE CHAIN.</p>
</header>

<div id="challengeTracker">
<div class="tracker-title">CHALLENGE TARGETS</div>
<div class="tracker-numbers" id="trackerNumbers"></div>
</div>

<main>
<div class="side">
<div class="panel"><div class="label">TIME</div><div class="value" id="timeValue">0:00</div></div>
<div class="panel"><div class="label">SCORE</div><div class="value" id="scoreValue">0</div></div>
<div class="panel"><div class="label">BEST</div><div class="value" id="bestValue">0</div></div>
<div class="panel"><div class="label">HOLD</div><div class="value" id="holdValue">—</div></div>
<div class="panel"><div class="label">NEXT</div><div id="nextPieces"></div></div>
<div class="panel"><div class="label">RANKING</div><ol id="rankList" style="margin:5px 0 0;padding-left:20px;text-align:left;font-size:11px;font-weight:800"></ol></div>
</div>

<div id="board"></div>

<div class="side">
<div class="panel"><div class="label">COMBO</div><div class="value" id="comboValue">0</div></div>
<div class="panel"><div class="label">MAX COMBO</div><div class="value" id="maxComboValue">0</div></div>
<div class="panel"><div class="label">POWER</div><div class="value" id="powerValue">0%</div><div class="power-bar"><div id="powerFill"></div></div></div>
<div class="panel" id="powerPanel"><div class="label">POWER</div><div class="value" id="powerValue2">0%</div><div class="power-bar"><div id="powerFill2"></div></div></div>
</div>
</main>

<footer>
<div id="message"></div>
<div class="controls">
<button id="leftBtn">◀</button>
<button id="downBtn">▼</button>
<button id="rightBtn">▶</button>
<button id="holdBtn">HOLD</button>
<button id="blastBtn">POWER</button>
</div>
<div class="controls">
<button id="startBtn">START / RESTART</button>
</div>
</footer>

<div id="overlay">
<div class="modal">
<h2 id="overlayTitle">SUM CHAIN</h2>
<p id="overlayText">プレイするモードを選んでね。<br>スペースキーで一気に落下。</p>
<div id="resultRanking"><h3>現在のランキング</h3><ol id="resultRankList"></ol></div>
<div id="modeButtons">
<button data-mode="normal">NORMAL</button>
<button data-mode="challenge">CHALLENGE</button>
<button data-mode="speed">SPEED</button>
<button data-mode="super">SUPER SPEED</button>
</div>
<button id="overlayBtn" style="display:none">このモードでもう一度</button>
<button id="modeSelectBtn" style="display:none">別モードを選ぶ</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const COLS=4,ROWS=10;
const CHALLENGE_POINTS={10:10,20:40,30:160,40:640,50:2560,60:10240,70:40960,80:163840,90:655360};
const TARGETS=[10,20,30,40,50,60,70,80,90];
const TIME_CHARGE_PER_SECOND=.02;
const MAX_GROUNDED_TIME=3000,LOCK_DELAY=600;
let board=[],piece=null,nextPieces=[],holdPieceValue=null,canHold=true;
let score=0,combo=0,maxCombo=0,power=0;
let running=false,paused=false,selectedMode="normal";
let fallInterval=750,lastFall=0,lastFrame=0;
let challengeTimeLeft=180000,challengeStart=0;
let completedTargets=new Set(),bingoCount=0;
let groundedY=null,groundedTimer=0,lockTimer=0;
let animationFrame=null,lastSecond=0;
let audioCtx=null;

function initAudio(){
 if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
}
function sound(freq=440,duration=.08,type="sine",volume=.05){
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration);
}
function boomSound(){
 if(!audioCtx)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type="sawtooth";osc.frequency.setValueAtTime(100,now);osc.frequency.exponentialRampToValueAtTime(25,now+.55);
 gain.gain.setValueAtTime(.3,now);gain.gain.exponentialRampToValueAtTime(.001,now+.6);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(now+.6);
}
function randomNumber(){
 const weights=selectedMode==="challenge"?[1,1,1,1,1,1,1,1,1]:[6,10,13,14,14,14,13,10,6];
 let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;
 for(let i=0;i<weights.length;i++){r-=weights[i];if(r<0)return i+1}
 return 1;
}
function newPiece(){return {x:1,y:0,n:randomNumber()}}
function init(){
 board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 piece=newPiece();nextPieces=[randomNumber(),randomNumber(),randomNumber()];
 holdPieceValue=null;canHold=true;score=0;combo=0;maxCombo=0;power=0;
 challengeTimeLeft=180000;challengeStart=performance.now();
 completedTargets=new Set();bingoCount=0;
 groundedY=null;groundedTimer=0;lockTimer=0;
 fallInterval=selectedMode==="super"?100:selectedMode==="speed"?200:750;
 $("message").textContent="";
 $("timeValue").textContent=selectedMode==="challenge"?"3:00":"0:00";
 $("scoreValue").textContent="0";$("comboValue").textContent="0";$("maxComboValue").textContent="0";
 $("holdValue").textContent="—";$("powerValue").textContent="0%";$("powerValue2").textContent="0%";
 $("powerFill").style.width="0%";$("powerFill2").style.width="0%";
 $("bestValue").textContent=Math.max(0,...getRankingScores());
 renderTracker();renderRanking();render();
}
function renderTracker(){
 const holder=$("trackerNumbers");holder.innerHTML="";
 TARGETS.forEach(n=>{
  const el=document.createElement("div");el.className="tracker-number"+(completedTargets.has(n)?" done":"");el.textContent=n;
  holder.appendChild(el);
 });
}
function render(){
 const boardEl=$("board");boardEl.innerHTML="";
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const cell=document.createElement("div");cell.className="cell";
  let n=board[y][x],isActive=piece&&piece.x===x&&piece.y===y;
  if(n||isActive){cell.classList.add("filled");if(isActive)cell.classList.add("active");
   const num=document.createElement("span");num.className="num";num.textContent=isActive?piece.n:n;cell.appendChild(num)}
  boardEl.appendChild(cell);
 }
 $("scoreValue").textContent=score.toLocaleString();
 $("comboValue").textContent=combo;$("maxComboValue").textContent=maxCombo;
 $("holdValue").textContent=holdPieceValue??"—";
 $("powerValue").textContent=Math.floor(power)+"%";$("powerValue2").textContent=Math.floor(power)+"%";
 $("powerFill").style.width=power+"%";$("powerFill2").style.width=power+"%";
 $("nextPieces").innerHTML=nextPieces.map(n=>`<span class="next-piece">${n}</span>`).join("");
}
function collision(x,y){
 if(x<0||x>=COLS||y>=ROWS)return true;
 if(y<0)return false;
 return board[y][x]!==0;
}
function move(dx,dy=0){
 if(!running||!piece)return;
 if(!collision(piece.x+dx,piece.y+dy)){
  piece.x+=dx;piece.y+=dy;
  if(dy>0){groundedY=null;groundedTimer=0;lockTimer=0}
  else if(groundedY!==null)lockTimer=0;
  render();
 }
}
function holdPiece(){
 if(!running||!piece||!canHold)return;
 const current=piece.n;
 if(holdPieceValue===null){holdPieceValue=current;spawnNext()}
 else{piece={x:1,y:0,n:holdPieceValue};holdPieceValue=current}
 canHold=false;groundedY=null;groundedTimer=0;lockTimer=0;
 if(collision(piece.x,piece.y)){endGame("gameover");return}
 render();
}
function spawnNext(){
 const n=nextPieces.shift();nextPieces.push(randomNumber());
 piece={x:1,y:0,n};
 groundedY=null;groundedTimer=0;lockTimer=0;canHold=true;
 if(collision(piece.x,piece.y)){endGame("gameover");return}
 render();
}
function lockPiece(){
 if(!piece)return;
 if(piece.y<0){endGame("gameover");return}
 board[piece.y][piece.x]=piece.n;
 piece=null;groundedY=null;groundedTimer=0;lockTimer=0;
 resolveMatches();
 if(running)spawnNext();
}

function findAllMatches(){
 const groups=[],seen=new Set();
 for(let y=0;y<ROWS;y++){
  for(let x=0;x<COLS;x++){
   if(!board[y][x])continue;
   for(const [dx,dy] of [[1,0],[0,1]]){
    let cells=[],sum=0,cx=x,cy=y;
    while(cx<COLS&&cy<ROWS&&board[cy][cx]){
     cells.push([cx,cy]);
     sum+=board[cy][cx];
     cx+=dx;
     cy+=dy;
    }
    if(TARGETS.includes(sum)&&cells.length>=2){
     const key=cells.map(([a,b])=>`${a},${b}`).join("|");
     if(!seen.has(key)){
      seen.add(key);
      groups.push({cells,sum});
     }
    }
   }
  }
 }
 return groups;
}

function resolveMatches(){
 let chain=0;
 while(true){
  const matches=findAllMatches();
  if(!matches.length)break;
  chain++;combo=chain;maxCombo=Math.max(maxCombo,combo);
  let coords=new Map(),target=0;
  matches.forEach(m=>{
   target=Math.max(target,m.sum);
   m.cells.forEach(([x,y])=>coords.set(`${x},${y}`,[x,y]));
  });
  const cells=[...coords.values()];
  cells.forEach(([x,y])=>board[y][x]=0);
  if(selectedMode==="challenge"){
   score+=(CHALLENGE_POINTS[target]||10)*combo;
   if(!completedTargets.has(target)){
    completedTargets.add(target);
    renderTracker();
    const idx=TARGETS.indexOf(target);
    const el=$("trackerNumbers").children[idx];
    if(el)el.classList.add("reached");
   }
   if(completedTargets.size===9){
    bingoCount++;score+=1000000;completedTargets.clear();renderTracker();
    $("message").textContent="BINGO!! +1,000,000";
    sound(880,.35,"triangle",.15);
   }else{
    $("message").textContent=target===10?"MAKE 10!":`${target} ${judgement(target)}`;
    sound(520+target*4,.12,"sine",.08);
   }
  }else{
   score+=cells.length*10*combo;
   $("message").textContent=target===10?"MAKE 10!":`${target} ${judgement(target)}`;
   sound(620,.1,"triangle",.07);
  }
  power=Math.min(100,power+cells.length*2.5);
  render(); 
  // Allow the next chain to be evaluated after gravity compacts the board.
  compactBoard();
 }
 if(chain===0)combo=0;
 else power=Math.min(100,power+5);
 if(selectedMode==="challenge")renderTracker();
 render();
}
function judgement(n){
 return ({20:"Nice",30:"Great",40:"Excellent",50:"Amazing",60:"Wonderful",70:"Fantastic",80:"Perfect",90:"Perfect!!"})[n]||"";
}
function compactBoard(){
 for(let x=0;x<COLS;x++){
  let vals=[];
  for(let y=ROWS-1;y>=0;y--)if(board[y][x])vals.push(board[y][x]);
  for(let y=ROWS-1;y>=0;y--)board[y][x]=vals[ROWS-1-y]||0;
 }
}
function blast(){
 if(!running||power<100)return;
 power=0;let removed=0;
 if(piece){piece=null;removed++}
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  if(Math.abs(x-1.5)<=1.5&&Math.abs(y-4.5)<=2.5&&board[y][x]){board[y][x]=0;removed++}
 }
 compactBoard();score+=removed*15;combo=0;
 boomSound();$("message").textContent="BOOM!!";
 render();if(!piece)spawnNext();
}
function getRankingScores(mode=selectedMode){
 try{
  const saved=localStorage.getItem(`sum10chain-ranks-${mode}`);
  return JSON.parse(saved||(mode==="normal"?localStorage.getItem("sum10chain-ranks"):"[]")||"[]");
 }catch(e){return []}
}
function saveScore(){
 const key=`sum10chain-ranks-${selectedMode}`;
 let scores=getRankingScores();
 scores.push(score);scores.sort((a,b)=>b-a);scores=scores.slice(0,5);
 try{localStorage.setItem(key,JSON.stringify(scores));if(selectedMode==="normal")localStorage.setItem("sum10chain-ranks",JSON.stringify(scores))}catch(e){}
}
function renderRanking(){
 const scores=getRankingScores();
 $("rankList").innerHTML="";
 if(!scores.length){$("rankList").innerHTML="<li>—</li>";return}
 scores.slice(0,5).forEach(s=>{
  const li=document.createElement("li");li.textContent=s.toLocaleString();$("rankList").appendChild(li);
 });
}
function renderResultRanking(){
 const scores=getRankingScores();
 const list=$("resultRankList");
 list.innerHTML="";
 if(!scores.length){list.innerHTML="<li>まだ記録がありません</li>";return}
 scores.slice(0,5).forEach((value,index)=>{
  const li=document.createElement("li");
  li.textContent=value.toLocaleString();
  if(index===scores.indexOf(score))li.classList.add("current-score");
  list.appendChild(li);
 });
}
function startGame(mode=selectedMode){
 selectedMode=mode;
 document.body.classList.toggle("challenge-mode",selectedMode==="challenge");
 $("overlay").classList.add("hidden");$("modeButtons").style.display="none";$("overlayBtn").style.display="none";$("modeSelectBtn").style.display="none";$("resultRanking").classList.remove("visible");
 init();running=true;paused=false;
 if(animationFrame)cancelAnimationFrame(animationFrame);
 lastFrame=performance.now();lastFall=lastFrame;
 animationFrame=requestAnimationFrame(gameLoop);
}
function gameLoop(now){
 if(!running)return;
 const dt=now-lastFrame;lastFrame=now;
 if(selectedMode==="challenge"){
  challengeTimeLeft=Math.max(0,challengeTimeLeft-dt);
  const seconds=Math.ceil(challengeTimeLeft/1000);
  $("timeValue").textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")}`;
  const elapsedTime=180000-challengeTimeLeft;
  const timeLevel=Math.floor(elapsedTime/15000);
  fallInterval=Math.max(160,750*Math.pow(.90,timeLevel));
  if(challengeTimeLeft<=0){endGame("timeup");return}
 }else{
  const elapsed=(now-challengeStart)/1000;
  $("timeValue").textContent=`${Math.floor(elapsed/60)}:${String(Math.floor(elapsed%60)).padStart(2,"0")}`;
 }
 if(piece&&now-lastFall>=fallInterval){
  lastFall=now;
  if(!collision(piece.x,piece.y+1)){
   piece.y++;groundedY=null;groundedTimer=0;lockTimer=0;
  }else{
   if(groundedY===null){groundedY=piece.y;groundedTimer=0;lockTimer=0}
   groundedTimer+=dt;lockTimer+=dt;
   if(groundedTimer>=MAX_GROUNDED_TIME||lockTimer>=LOCK_DELAY){lockPiece()}
  }
  render();
 }
 if(piece&&collision(piece.x,piece.y+1)){
  if(groundedY===null){groundedY=piece.y;groundedTimer=0;lockTimer=0}
  groundedTimer+=dt;
  if(groundedTimer>=MAX_GROUNDED_TIME){lockPiece()}
 }
 if(selectedMode!=="challenge")power=Math.min(100,power+TIME_CHARGE_PER_SECOND*dt/1000);
 render();
 animationFrame=requestAnimationFrame(gameLoop);
}
function endGame(reason){
 if(!running)return;
 running=false;
 if(animationFrame)cancelAnimationFrame(animationFrame);
 saveScore();renderRanking();
 $("overlayTitle").textContent=reason==="timeup"?"TIME UP!":"GAME OVER";
 $("overlayText").innerHTML=`${selectedMode==="challenge"?"CHALLENGE":selectedMode==="super"?"SUPER SPEED":selectedMode==="speed"?"SPEED":"NORMAL"}<br>SCORE: <b>${score.toLocaleString()}</b><br>最高コンボ: <b>${maxCombo}</b>${reason==="timeup"?"<br>3分間お疲れさま！":""}`;
 $("resultRanking").classList.add("visible");
 renderResultRanking();
 $("modeButtons").style.display="none";$("overlayBtn").style.display="inline-block";$("overlayBtn").textContent="このモードでもう一度";
 $("modeSelectBtn").style.display="inline-block";$("modeSelectBtn").textContent="別モードを選ぶ";$("overlay").classList.remove("hidden");
}
$("leftBtn").addEventListener("click",()=>move(-1));
$("rightBtn").addEventListener("click",()=>move(1));
$("downBtn").addEventListener("click",()=>move(0,1));
$("holdBtn").addEventListener("click",holdPiece);
$("blastBtn").addEventListener("click",blast);
$("startBtn").addEventListener("click",()=>startGame(selectedMode));
$("overlayBtn").addEventListener("click",()=>startGame(selectedMode));
$("modeButtons").querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{initAudio();startGame(btn.dataset.mode)}));
$("modeSelectBtn").addEventListener("click",()=>{
 running=false;paused=false;piece=null;selectedMode="normal";document.body.classList.remove("challenge-mode");
 $("overlayTitle").textContent="SUM CHAIN";
 $("overlayText").innerHTML="プレイするモードを選んでね。<br>スペースキーで一気に落下。";
 $("resultRanking").classList.remove("visible");
 $("modeButtons").style.display="flex";$("overlayBtn").style.display="none";$("modeSelectBtn").style.display="none";
 $("overlay").classList.remove("hidden");render();
});
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
 else if(e.key==="ArrowRight"){e.preventDefault();move(1)}
 else if(e.key==="ArrowDown"){e.preventDefault();move(0,1)}
 else if(e.key===" "){e.preventDefault();if(running&&piece){while(!collision(piece.x,piece.y+1))piece.y++;lockPiece();render()}}
 else if(e.key.toLowerCase()==="c"||e.key==="Shift"||e.key==="ArrowUp"){e.preventDefault();holdPiece()}
 else if(e.key.toLowerCase()==="e"){blast()}
});
renderRanking();
</script>
</body>
</html>
