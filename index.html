
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAKE 10 TETRIS</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 background:#10131e;color:#f4f6ff;
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 display:flex;justify-content:center;align-items:center;
}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid white;outline-offset:2px}
.app{
 width:min(850px,100%);height:100dvh;max-height:100dvh;
 padding:clamp(4px,1vh,10px);
 display:flex;flex-direction:column;gap:clamp(3px,.65vh,7px);
 overflow:hidden;
}
header{text-align:center;flex-shrink:0}
h1{font-size:clamp(19px,3.3vh,30px);letter-spacing:2px;margin:0}
.subtitle{color:#9da8c7;font-size:clamp(9px,1.4vh,12px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex-shrink:0}
.stat{background:#1b2031;border:1px solid #303951;border-radius:8px;padding:3px;text-align:center}
.stat span{display:block;color:#9da8c7;font-size:clamp(8px,1.2vh,11px)}
.stat strong{font-size:clamp(14px,2.3vh,22px);font-variant-numeric:tabular-nums}
.layout{
 display:grid;grid-template-columns:minmax(0,1fr) clamp(115px,24%,180px);
 gap:clamp(5px,1.2vw,12px);flex:1;min-height:0;overflow:hidden;
}
.game-area{min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px}
.board-wrap{
 flex:1;min-height:0;display:flex;justify-content:center;align-items:center;
 background:#0b0e17;border:2px solid #303951;border-radius:9px;padding:4px;overflow:hidden;
}
#board{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
 grid-template-rows:repeat(10,minmax(0,1fr));
 gap:clamp(2px,.4vh,4px);
 height:100%;max-height:100%;
 width:min(100%,calc((100dvh - 140px)*.4));
}
.cell{
 min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;
 border-radius:4px;background:#1b2031;border:1px solid #282f44;
 font-size:clamp(12px,2.6vh,23px);font-weight:800;
}
.cell.filled{color:#10131e;border:none;box-shadow:inset 0 -2px #0002}
.cell.active{outline:2px solid white;outline-offset:-3px}
.cell.bomb{background:#ff594f!important;color:white!important;font-size:clamp(15px,3vh,26px)}
.side{min-height:0;display:flex;flex-direction:column;gap:clamp(3px,.6vh,7px);overflow:hidden}
.panel{background:#1b2031;border:1px solid #303951;border-radius:8px;padding:clamp(4px,.8vh,9px);flex-shrink:0}
.panel h2{font-size:clamp(9px,1.35vh,12px);color:#9da8c7;letter-spacing:1px;margin:0 0 4px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.mini-cell{aspect-ratio:1;min-width:0;border-radius:3px;background:#0f1320;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(9px,1.7vh,14px)}
#holdStatus{font-size:clamp(7px,1vh,10px);color:#9da8c7;margin-top:3px}
.next-item{margin-bottom:4px}
.next-item:last-child{margin-bottom:0}
.next-label{font-size:clamp(8px,1.15vh,10px);color:#9da8c7;margin-bottom:2px}
.controls{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.btn{border:1px solid #3a4560;background:#252d43;color:#f4f6ff;padding:clamp(4px,.7vh,8px) 3px;border-radius:6px;font-size:clamp(10px,1.4vh,13px);font-weight:700}
.btn:hover{background:#343f5b}
.btn.primary{background:#7964f4;border-color:#7964f4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.help{font-size:clamp(8px,1.1vh,10px);line-height:1.45;color:#aab4ce}
.help strong{color:#f4f6ff}
.ranking{min-height:0;overflow:hidden}
.rank-row{display:flex;justify-content:space-between;gap:3px;font-size:clamp(8px,1.15vh,11px);padding:2px 0;border-bottom:1px solid #303951}
.rank-row:last-child{border-bottom:0}
.rank-name{color:#aab4ce;white-space:nowrap}
.rank-score{font-variant-numeric:tabular-nums;font-weight:700}
#message{flex-shrink:0;background:#1b2031;border:1px solid #303951;border-radius:6px;padding:5px;text-align:center;font-size:clamp(9px,1.3vh,12px);color:#c9d1e9}
#message.good{color:#74f0b0}
#message.bad{color:#ff9ca7}
.footer{font-size:clamp(8px,1.1vh,10px);color:#7e89a8;text-align:center;flex-shrink:0}
.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:4px;flex-shrink:0}
.mobile-controls button{padding:5px 0}
@media(max-width:520px){
 .layout{grid-template-columns:minmax(0,1fr) clamp(98px,27%,125px)}
 .help{line-height:1.35}
}
@media(max-height:560px){
 .subtitle{display:none}
 .app{gap:3px}
 .panel{padding:3px}
 .help{font-size:8px}
 .rank-row{padding:1px 0}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <h1>MAKE 10 <span style="color:#8c7bff">TETRIS</span></h1>
  <div class="subtitle">積んで、つないで、10を作れ。</div>
 </header>

 <div class="stats">
  <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
  <div class="stat"><span>CHAIN BEST</span><strong id="bestChain">0</strong></div>
  <div class="stat"><span>LEVEL</span><strong id="level">1</strong></div>
 </div>

 <div class="layout">
  <div class="game-area">
   <div class="board-wrap">
    <div id="board" aria-label="4列10行のゲーム盤"></div>
   </div>
   <div class="mobile-controls">
    <button class="btn" id="leftBtn">←</button>
    <button class="btn" id="rightBtn">→</button>
    <button class="btn" id="downBtn">↓</button>
    <button class="btn" id="dropBtn">DROP</button>
   </div>
   <div id="message">スタートを押してゲーム開始！</div>
  </div>

  <aside class="side">
   <div class="panel">
    <h2>HOLD</h2>
    <div id="holdGrid" class="mini-grid"></div>
    <div id="holdStatus">HOLD AVAILABLE</div>
   </div>

   <div class="panel">
    <h2>NEXT</h2>
    <div id="nextList"></div>
   </div>

   <div class="controls">
    <button class="btn primary" id="startBtn">ゲーム開始</button>
    <button class="btn" id="holdBtn">HOLD [C]</button>
    <button class="btn" id="pauseBtn" disabled>一時停止 [P]</button>
    <button class="btn" id="restartBtn">リスタート</button>
   </div>

   <div class="panel ranking">
    <h2>🏆 RANKING TOP 5</h2>
    <div id="rankingList"></div>
   </div>

   <div class="panel help">
    <strong>数字ブロック</strong><br>
    1〜6は同確率。大きい数字ほど低確率。<br>
    <strong>💣 ボム</strong><br>
    置くと周囲8マスを消去。HOLD不可。<br>
    <strong>合計10</strong><br>
    縦横の連続した合計10を消去。<br>
    <strong>GAME OVER</strong><br>
    いずれかの列が最上段まで積まれると終了。
   </div>
  </aside>
 </div>

 <div class="footer">← → 移動 / ↓ 高速落下 / SPACE 一気に落下 / C HOLD / P 一時停止</div>
</div>

<script>
"use strict";

const W=4,H=10;
const BOMB="BOMB";
const COLORS={
  1:"#8de4ff",2:"#78c6ff",3:"#8c9bff",
  4:"#bd91ff",5:"#ed91ff",6:"#ff91c7",
  7:"#ffab91",8:"#ffd166",9:"#a9e66e"
};
const RANK_KEY="make10_tetris_ranking_v1";

const $=id=>document.getElementById(id);
const boardEl=$("board");
const holdGrid=$("holdGrid");
const nextList=$("nextList");
const rankingList=$("rankingList");

let board,current,queue,hold,holdUsed;
let score,level,bestChain,elapsed,chainCount;
let running=false,paused=false,gameOver=false;
let lastTime=0,dropCounter=0,rafId=0;
let scoreRecorded=false;

const cells=[];
for(let y=0;y<H;y++){
 cells[y]=[];
 for(let x=0;x<W;x++){
  const el=document.createElement("div");
  el.className="cell";
  boardEl.appendChild(el);
  cells[y][x]=el;
 }
}

/*
 出現率：
 1〜6：各12
 7：8
 8：5
 9：2
 ボム：4
 合計91
*/
function randomPiece(){
 const total=91;
 let r=Math.random()*total;
 const weights=[
  [1,12],[2,12],[3,12],[4,12],[5,12],[6,12],
  [7,8],[8,5],[9,2],[BOMB,4]
 ];
 for(const [value,weight] of weights){
  r-=weight;
  if(r<0)return {value,x:1,y:0};
 }
 return {value:1,x:1,y:0};
}

function makeEmptyBoard(){
 return Array.from({length:H},()=>Array(W).fill(0));
}

function setMessage(text,type=""){
 $("message").textContent=text;
 $("message").className=type;
}

function getRankings(){
 try{
  const data=JSON.parse(localStorage.getItem(RANK_KEY)||"[]");
  return Array.isArray(data)?data.filter(r=>
   r&&Number.isFinite(r.score)&&Number.isFinite(r.date)
  ).sort((a,b)=>b.score-a.score).slice(0,5):[];
 }catch(e){return []}
}

function saveRanking(){
 if(scoreRecorded)return;
 scoreRecorded=true;
 const rankings=getRankings();
 rankings.push({score,date:Date.now()});
 rankings.sort((a,b)=>b.score-a.score);
 try{
  localStorage.setItem(RANK_KEY,JSON.stringify(rankings.slice(0,5)));
 }catch(e){
  setMessage("ランキングを保存できませんでした。");
 }
 renderRanking();
}

function renderRanking(){
 const rankings=getRankings();
 rankingList.innerHTML="";
 if(rankings.length===0){
  const d=document.createElement("div");
  d.className="rank-row";
  d.textContent="まだ記録がありません";
  rankingList.appendChild(d);
  return;
 }
 rankings.forEach((r,i)=>{
  const row=document.createElement("div");
  row.className="rank-row";
  const name=document.createElement("span");
  name.className="rank-name";
  name.textContent=`${i+1}位`;
  const points=document.createElement("span");
  points.className="rank-score";
  points.textContent=r.score.toLocaleString();
  row.append(name,points);
  rankingList.appendChild(row);
 });
}

function init(){
 cancelAnimationFrame(rafId);
 board=makeEmptyBoard();
 current=null;
 queue=[randomPiece(),randomPiece(),randomPiece()];
 hold=null;holdUsed=false;
 score=0;level=1;bestChain=0;elapsed=0;chainCount=0;
 running=false;paused=false;gameOver=false;
 lastTime=0;dropCounter=0;scoreRecorded=false;
 $("startBtn").disabled=false;
 $("startBtn").textContent="ゲーム開始";
 $("pauseBtn").disabled=true;
 $("pauseBtn").textContent="一時停止 [P]";
 setMessage("スタートを押してゲーム開始！");
 render();
}

function ensureQueue(){
 while(queue.length<3)queue.push(randomPiece());
}

function valid(x,y,value){
 return x>=0&&x<W&&y>=0&&y<H&&board[y][x]===0;
}

function spawnPiece(){
 ensureQueue();
 current=queue.shift();
 ensureQueue();
 current.x=1;current.y=0;
 holdUsed=false;
 if(!valid(current.x,current.y,current.value)){
  endGame();return;
 }
 render();
}

function move(dx,dy){
 if(!running||paused||gameOver||!current)return false;
 if(valid(current.x+dx,current.y+dy,current.value)){
  current.x+=dx;current.y+=dy;
  render();return true;
 }
 return false;
}

function holdPiece(){
 if(!running||paused||gameOver||!current)return;
 if(current.value===BOMB){
  setMessage("ボムはホールドできない！");
  return;
 }
 if(holdUsed){
  setMessage("このブロックではもうHOLDできない！");
  return;
 }
 const old=hold;
 hold=current.value;
 holdUsed=true;
 if(old===null){
  spawnPiece();
  holdUsed=true;
 }else{
  current.value=old;
  current.x=1;current.y=0;
  if(!valid(current.x,current.y,current.value)){
   endGame();return;
  }
 }
 setMessage("ホールド！");
 render();
}

function lockPiece(){
 if(!current||gameOver)return;
 const {x,y,value}=current;
 if(!valid(x,y,value)){
  endGame();return;
 }

 current=null;

 if(value===BOMB){
  explodeBomb(x,y);
 }else{
  board[y][x]=value;
 }

 resolveClears();

 // いずれかの列が最上段まで到達したらゲームオーバー
 if(board[0].some(v=>v!==0)){
  endGame();return;
 }

 if(!gameOver)spawnPiece();
}

function explodeBomb(x,y){
 let cleared=0;
 for(let dy=-1;dy<=1;dy++){
  for(let dx=-1;dx<=1;dx++){
   if(dx===0&&dy===0)continue;
   const nx=x+dx,ny=y+dy;
   if(nx<0||nx>=W||ny<0||ny>=H)continue;
   if(board[ny][nx]!==0){
    board[ny][nx]=0;
    cleared++;
   }
  }
 }
 compactBoard();
 const bonus=cleared*50;
 score+=bonus;
 setMessage(`💣 ボム爆発！ ${cleared}マス消去！ +${bonus}点`,"good");
 render();
}

function findMatches(){
 const found=new Set();

 function scanLine(coords){
  for(let start=0;start<coords.length;start++){
   let sum=0;
   for(let end=start;end<coords.length;end++){
    const [y,x]=coords[end];
    const v=board[y][x];
    if(v===0||v===BOMB)break;
    sum+=v;
    if(sum>10)break;
    if(sum===10){
     for(let i=start;i<=end;i++){
      found.add(coords[i].join(","));
     }
     break;
    }
   }
  }
 }

 for(let y=0;y<H;y++){
  scanLine(Array.from({length:W},(_,x)=>[y,x]));
 }
 for(let x=0;x<W;x++){
  scanLine(Array.from({length:H},(_,y)=>[y,x]));
 }
 return [...found].map(k=>k.split(",").map(Number));
}

function compactBoard(){
 for(let x=0;x<W;x++){
  let write=H-1;
  for(let y=H-1;y>=0;y--){
   if(board[y][x]!==0){
    board[write][x]=board[y][x];
    if(write!==y)board[y][x]=0;
    write--;
   }
  }
  for(let y=write;y>=0;y--)board[y][x]=0;
 }
}

function resolveClears(){
 let totalCleared=0;
 chainCount=0;

 while(chainCount<40){
  const matches=findMatches();
  if(matches.length===0)break;

  chainCount++;
  bestChain=Math.max(bestChain,chainCount);

  const unique=new Set(matches.map(([y,x])=>`${y},${x}`));
  const count=unique.size;
  totalCleared+=count;
  score+=count*100*chainCount;

  for(const key of unique){
   const [y,x]=key.split(",").map(Number);
   board[y][x]=0;
  }
  compactBoard();
 }

 if(totalCleared>0){
  setMessage(
   `${chainCount}連鎖！ ${totalCleared}マス消去！`,
   "good"
  );
 }
 updateStats();
}

function hardDrop(){
 if(!running||paused||gameOver||!current)return;
 let distance=0;
 while(valid(current.x,current.y+1,current.value)){
  current.y++;
  distance++;
 }
 score+=distance*2;
 lockPiece();
 updateStats();
}

function endGame(){
 if(gameOver)return;
 gameOver=true;
 running=false;
 paused=false;
 current=null;
 saveRanking();
 $("pauseBtn").disabled=true;
 $("startBtn").disabled=false;
 $("startBtn").textContent="もう一度プレイ";
 setMessage(`GAME OVER — スコア ${score.toLocaleString()}点`,"bad");
 render();
}

function startGame(){
 if(gameOver)init();
 if(running&&!paused)return;
 running=true;paused=false;
 $("startBtn").disabled=true;
 $("pauseBtn").disabled=false;
 $("pauseBtn").textContent="一時停止 [P]";
 if(!current)spawnPiece();
 if(gameOver)return;
 lastTime=performance.now();
 dropCounter=0;
 cancelAnimationFrame(rafId);
 rafId=requestAnimationFrame(loop);
 setMessage("ゲーム開始！ 10を作って連鎖を狙おう。");
}

function togglePause(){
 if(!running||gameOver)return;
 paused=!paused;
 $("pauseBtn").textContent=paused?"再開 [P]":"一時停止 [P]";
 if(paused){
  setMessage("一時停止中");
 }else{
  lastTime=performance.now();
  setMessage("ゲーム再開！");
  rafId=requestAnimationFrame(loop);
 }
}

function loop(now){
 if(!running||paused||gameOver)return;
 const dt=Math.min(now-lastTime,100);
 lastTime=now;
 elapsed+=dt;
 level=1+Math.floor(elapsed/20000);
 const interval=Math.max(120,850-(level-1)*65);
 dropCounter+=dt;
 if(dropCounter>=interval){
  dropCounter=0;
  if(!move(0,1))lockPiece();
 }
 updateStats();
 render();
 if(running&&!paused&&!gameOver)rafId=requestAnimationFrame(loop);
}

function updateStats(){
 $("score").textContent=score.toLocaleString();
 $("bestChain").textContent=bestChain;
 $("level").textContent=level;
}

function pieceLabel(value){
 return value===BOMB?"💣":value;
}

function renderMini(container,value){
 container.innerHTML="";
 for(let i=0;i<4;i++){
  const d=document.createElement("div");
  d.className="mini-cell";
  if(value!==null&&i===1){
   d.textContent=pieceLabel(value);
   d.style.background=value===BOMB?"#ff594f":COLORS[value];
   d.style.color="#10131e";
  }
  container.appendChild(d);
 }
}

function renderSide(){
 renderMini(holdGrid,hold);
 $("holdStatus").textContent=holdUsed?"HOLD USED":"HOLD AVAILABLE";
 nextList.innerHTML="";
 ensureQueue();

 queue.slice(0,3).forEach((p,i)=>{
  const item=document.createElement("div");
  item.className="next-item";
  const label=document.createElement("div");
  label.className="next-label";
  label.textContent=`NEXT ${i+1}`;

  const grid=document.createElement("div");
  grid.className="mini-grid";
  for(let j=0;j<4;j++){
   const d=document.createElement("div");
   d.className="mini-cell";
   if(j===1){
    d.textContent=pieceLabel(p.value);
    d.style.background=p.value===BOMB?"#ff594f":COLORS[p.value];
    d.style.color=p.value===BOMB?"white":"#10131e";
   }
   grid.appendChild(d);
  }
  item.append(label,grid);
  nextList.appendChild(item);
 });
}

function render(){
 if(!board)return;
 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
   const el=cells[y][x];
   let v=board[y][x];
   const active=!!(current&&!gameOver&&current.x===x&&current.y===y);
   if(active)v=current.value;

   el.textContent=v?pieceLabel(v):"";
   el.className="cell";

   if(v===BOMB){
    el.style.background="#ff594f";
    el.style.color="white";
    el.classList.add("filled","bomb");
   }else{
    el.style.background=v?COLORS[v]:"#1b2031";
    el.style.color=v?"#10131e":"";
    if(v)el.classList.add("filled");
   }
   if(active)el.classList.add("active");
  }
 }
 updateStats();
 renderSide();
 renderRanking();
}

$("startBtn").addEventListener("click",startGame);
$("restartBtn").addEventListener("click",()=>{
 init();startGame();
});
$("pauseBtn").addEventListener("click",togglePause);
$("holdBtn").addEventListener("click",holdPiece);
$("leftBtn").addEventListener("click",()=>move(-1,0));
$("rightBtn").addEventListener("click",()=>move(1,0));
$("downBtn").addEventListener("click",()=>{
 if(move(0,1)){score++;updateStats();}
 else if(running&&!paused&&!gameOver)lockPiece();
});
$("dropBtn").addEventListener("click",hardDrop);

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key)){
  e.preventDefault();
 }
 if(e.repeat&&["c","C","p","P"," "].includes(e.key))return;
 if(e.key==="Enter"&&!running&&!gameOver)startGame();
 if(e.key==="ArrowLeft")move(-1,0);
 if(e.key==="ArrowRight")move(1,0);
 if(e.key==="ArrowDown"){
  if(move(0,1)){score++;updateStats();}
  else if(running&&!paused&&!gameOver)lockPiece();
 }
 if(e.key===" ")hardDrop();
 if(e.key==="c"||e.key==="C")holdPiece();
 if(e.key==="p"||e.key==="P")togglePause();
});

renderRanking();
init();
</script>
</body>
</html>
