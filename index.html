<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKE 10 TETRIS</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;min-height:100vh;background:#10131e;color:#f4f6ff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;padding:20px 12px;
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.app{width:min(760px,100%)}
header{text-align:center;margin-bottom:18px}
h1{font-size:clamp(24px,5vw,36px);letter-spacing:2px;margin:0}
.subtitle{color:#9da8c7;font-size:13px;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#1b2031;border:1px solid #303951;border-radius:12px;padding:10px;text-align:center}
.stat span{display:block;color:#9da8c7;font-size:11px;margin-bottom:4px}
.stat strong{font-size:clamp(17px,4vw,24px);font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:start}
.board-wrap{position:relative;background:#0b0e17;border:2px solid #303951;border-radius:12px;padding:6px;overflow:hidden}
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.cell{
  aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:#1b2031;border:1px solid #282f44;
  font-size:clamp(14px,3.8vw,24px);font-weight:800;
  font-variant-numeric:tabular-nums;transition:background .1s;
}
.cell.filled{color:#10131e;border:none;box-shadow:inset 0 -3px #0002}
.cell.active{outline:2px solid #fff;outline-offset:-3px;z-index:1}
.cell.clear{animation:pop .22s ease-in-out}
@keyframes pop{50%{transform:scale(.65);opacity:.35}}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:#1b2031;border:1px solid #303951;border-radius:12px;padding:12px}
.panel h2{font-size:12px;color:#9da8c7;letter-spacing:1px;margin:0 0 10px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.mini-cell{aspect-ratio:1;border-radius:4px;background:#0f1320;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.next-item{margin-bottom:9px}
.next-item:last-child{margin-bottom:0}
.next-label{font-size:11px;color:#9da8c7;margin-bottom:4px}
#holdStatus{font-size:12px;color:#9da8c7}
.controls{display:flex;flex-direction:column;gap:7px}
.btn{border:1px solid #3a4560;background:#252d43;color:#f4f6ff;padding:10px;border-radius:9px;font-weight:700}
.btn:hover{background:#343f5b}
.btn.primary{background:#7964f4;border-color:#7964f4;color:white}
.btn.primary:hover{background:#9180ff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.help{font-size:12px;line-height:1.8;color:#aab4ce}
.help strong{color:#f4f6ff}
.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.mobile-controls button{font-size:20px;padding:12px 0}
#message{margin-top:12px;min-height:44px;background:#1b2031;border:1px solid #303951;border-radius:10px;padding:12px;text-align:center;font-size:13px;color:#c9d1e9}
#message.good{color:#74f0b0}
#message.bad{color:#ff9ca7}
.footer{color:#7e89a8;font-size:11px;text-align:center;margin-top:12px}
@media(max-width:520px){
 body{padding:12px 8px}
 .layout{grid-template-columns:minmax(0,1fr) 108px;gap:8px}
 .panel{padding:8px}
 .cell{font-size:clamp(14px,5vw,22px)}
 .mini-cell{font-size:10px}
 .mobile-controls{display:grid}
 .controls .btn{padding:8px 3px;font-size:12px}
 .help{font-size:11px}
}
@media(max-width:360px){
 .layout{grid-template-columns:minmax(0,1fr) 94px}
 #board{gap:3px}
 .board-wrap{padding:4px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MAKE 10 <span style="color:#8c7bff">TETRIS</span></h1>
    <div class="subtitle">積んで、つないで、10を作れ。</div>
  </header>

  <div class="stats">
    <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
    <div class="stat"><span>CHAIN BEST</span><strong id="bestChain">0</strong></div>
    <div class="stat"><span>LEVEL</span><strong id="level">1</strong></div>
  </div>

  <div class="layout">
    <div>
      <div class="board-wrap">
        <div id="board" aria-label="4列10行のゲーム盤"></div>
      </div>
      <div class="mobile-controls">
        <button class="btn" id="leftBtn" aria-label="左">←</button>
        <button class="btn" id="rightBtn" aria-label="右">→</button>
        <button class="btn" id="rotateBtn" aria-label="回転">↻</button>
        <button class="btn" id="downBtn" aria-label="高速落下">↓</button>
      </div>
      <div id="message">スタートを押してゲーム開始！</div>
    </div>

    <aside class="side">
      <div class="panel">
        <h2>HOLD</h2>
        <div id="holdGrid" class="mini-grid"></div>
        <div id="holdStatus">HOLD AVAILABLE</div>
      </div>
      <div class="panel">
        <h2>NEXT</h2>
        <div id="nextList"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="startBtn">ゲーム開始</button>
        <button class="btn" id="holdBtn">ホールド [C]</button>
        <button class="btn" id="pauseBtn" disabled>一時停止 [P]</button>
        <button class="btn" id="restartBtn">リスタート</button>
      </div>
      <div class="panel help">
        <h2>RULES</h2>
        <strong>10を作れ！</strong><br>
        縦・横に隣接する数字の和が10になると消える。<br><br>
        <strong>連鎖ボーナス</strong><br>
        連続消去で獲得点アップ！<br><br>
        <strong>GAME OVER</strong><br>
        いずれかの列が10マス埋まると終了。
      </div>
    </aside>
  </div>
  <div class="footer">← → 移動 / ↑ 回転 / ↓ 高速落下 / SPACE 一気に落下 / C HOLD / P 一時停止</div>
</div>

<script>
"use strict";

const W = 4, H = 10;
const COLORS = {
  1:"#8de4ff", 2:"#78c6ff", 3:"#8c9bff",
  4:"#bd91ff", 5:"#ed91ff", 6:"#ff91c7",
  7:"#ffab91", 8:"#ffd166", 9:"#a9e66e"
};

const $ = id => document.getElementById(id);
const boardEl = $("board");
const holdGrid = $("holdGrid");
const nextList = $("nextList");

let board, current, queue, hold, holdUsed;
let score, level, bestChain, elapsed, chainCount;
let running = false, paused = false, gameOver = false;
let lastTime = 0, dropCounter = 0, rafId = 0;
let clearCells = new Set();
let clearUntil = 0;
let messageTimer = null;
let pieceSerial = 0;

function randomPiece(){
  return {
    id: ++pieceSerial,
    value: 1 + Math.floor(Math.random()*9),
    x: 1,
    y: 0
  };
}

function makeEmptyBoard(){
  return Array.from({length:H},()=>Array(W).fill(0));
}

function makeCell(){
  const d = document.createElement("div");
  d.className = "cell";
  boardEl.appendChild(d);
  return d;
}

const cells = [];
for(let y=0;y<H;y++){
  cells[y]=[];
  for(let x=0;x<W;x++) cells[y][x]=makeCell();
}

function init(){
  cancelAnimationFrame(rafId);
  board=makeEmptyBoard();
  current=null;
  queue=[randomPiece(),randomPiece(),randomPiece()];
  hold=null;
  holdUsed=false;
  score=0;
  level=1;
  bestChain=0;
  elapsed=0;
  chainCount=0;
  running=false;
  paused=false;
  gameOver=false;
  dropCounter=0;
  lastTime=0;
  clearCells.clear();
  clearUntil=0;
  $("startBtn").disabled=false;
  $("pauseBtn").disabled=true;
  $("pauseBtn").textContent="一時停止 [P]";
  $("startBtn").textContent="ゲーム開始";
  setMessage("スタートを押してゲーム開始！");
  render();
}

function setMessage(text,type=""){
  const el=$("message");
  el.textContent=text;
  el.className=type;
}

function ensureQueue(){
  while(queue.length<3) queue.push(randomPiece());
}

function spawnPiece(){
  ensureQueue();
  current=queue.shift();
  ensureQueue();
  current.x=1;
  current.y=0;
  holdUsed=false;
  if(!valid(current.x,current.y,current.value)){
    endGame();
    return;
  }
  render();
}

function valid(x,y,value){
  if(x<0 || x>=W || y<0 || y>=H) return false;
  return board[y][x]===0;
}

function move(dx,dy){
  if(!running || paused || gameOver || !current) return false;
  const nx=current.x+dx, ny=current.y+dy;
  if(valid(nx,ny,current.value)){
    current.x=nx;
    current.y=ny;
    render();
    return true;
  }
  return false;
}

function rotatePiece(){
  if(!running || paused || gameOver || !current) return;
  // 数字ブロックなので回転は横移動と同じく位置を変えない。
  // 回転キーは、左右どちらかへ移動可能な場合に方向転換する。
  const candidates=[-1,1];
  for(const dx of candidates){
    if(valid(current.x+dx,current.y,current.value)){
      current.x+=dx;
      render();
      return;
    }
  }
}

function holdPiece(){
  if(!running || paused || gameOver || !current || holdUsed) return;
  const old=hold;
  hold=current.value;
  holdUsed=true;
  if(old===null){
    spawnPiece();
    holdUsed=true;
  }else{
    current.value=old;
    current.x=1;
    current.y=0;
    if(!valid(current.x,current.y,current.value)){
      endGame();
      return;
    }
  }
  setMessage("ホールド！");
  render();
}

function lockPiece(){
  if(!current || gameOver) return;
  const {x,y,value}=current;
  if(y<0 || board[y][x]!==0){
    endGame();
    return;
  }
  board[y][x]=value;
  current=null;
  chainCount=0;
  resolveClears();
  if(!gameOver) spawnPiece();
}

function findMatches(){
  const found=[];
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      if(board[y][x]===0) continue;
      if(x+1<W && board[y][x+1]!==0 && board[y][x]+board[y][x+1]===10){
        found.push([y,x],[y,x+1]);
      }
      if(y+1<H && board[y+1][x]!==0 && board[y][x]+board[y+1][x]===10){
        found.push([y,x],[y+1,x]);
      }
    }
  }
  const unique=new Map();
  for(const [y,x] of found) unique.set(`${y},${x}`,[y,x]);
  return [...unique.values()];
}

function compactBoard(){
  for(let x=0;x<W;x++){
    let write=H-1;
    for(let y=H-1;y>=0;y--){
      if(board[y][x]!==0){
        board[write][x]=board[y][x];
        if(write!==y) board[y][x]=0;
        write--;
      }
    }
    for(let y=write;y>=0;y--) board[y][x]=0;
  }
}

function resolveClears(){
  const matches=findMatches();
  if(matches.length===0){
    chainCount=0;
    return;
  }

  chainCount++;
  bestChain=Math.max(bestChain,chainCount);

  const count=matches.length;
  const bonus=chainCount;
  score+=count*100*bonus;
  matches.forEach(([y,x])=>board[y][x]=0);
  compactBoard();

  render();
  setMessage(
    `${chainCount}連鎖！ ${count}マス消去！ +${count*100*bonus}点`,
    "good"
  );

  // 盤面を安定させるため、連鎖を同一ターン内で解決する
  let guard=0;
  while(guard++<H*W){
    const next=findMatches();
    if(next.length===0) break;
    chainCount++;
    bestChain=Math.max(bestChain,chainCount);
    score+=next.length*100*chainCount;
    for(const [y,x] of next) board[y][x]=0;
    compactBoard();
  }

  if(chainCount>1){
    setMessage(`${chainCount}連鎖達成！ スコア +${score.toLocaleString()}点`, "good");
  }
  updateStats();
}

function hardDrop(){
  if(!running || paused || gameOver || !current) return;
  let distance=0;
  while(valid(current.x,current.y+1,current.value)){
    current.y++;
    distance++;
  }
  score+=distance*2;
  lockPiece();
  updateStats();
}

function stepDrop(){
  if(!current || !running || paused || gameOver) return;
  if(!move(0,1)) lockPiece();
}

function endGame(){
  gameOver=true;
  running=false;
  paused=false;
  current=null;
  $("pauseBtn").disabled=true;
  $("startBtn").disabled=false;
  $("startBtn").textContent="もう一度プレイ";
  setMessage(`GAME OVER — スコア ${score.toLocaleString()}点`, "bad");
  render();
}

function startGame(){
  if(gameOver){
    init();
  }
  if(running && !paused) return;
  running=true;
  paused=false;
  $("startBtn").disabled=true;
  $("pauseBtn").disabled=false;
  $("pauseBtn").textContent="一時停止 [P]";
  if(!current) spawnPiece();
  lastTime=performance.now();
  dropCounter=0;
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
  setMessage("ゲーム開始！ 10を作って連鎖を狙おう。");
}

function togglePause(){
  if(!running || gameOver) return;
  paused=!paused;
  $("pauseBtn").textContent=paused?"再開 [P]":"一時停止 [P]";
  if(paused){
    setMessage("一時停止中");
  }else{
    lastTime=performance.now();
    setMessage("ゲーム再開！");
    rafId=requestAnimationFrame(loop);
  }
}

function loop(now){
  if(!running || paused || gameOver) return;
  const dt=Math.min(now-lastTime,100);
  lastTime=now;
  elapsed+=dt;
  level=1+Math.floor(elapsed/20000);
  const interval=Math.max(120,850-(level-1)*65);
  dropCounter+=dt;
  if(dropCounter>=interval){
    dropCounter=0;
    stepDrop();
  }
  updateStats();
  render();
  if(running && !paused && !gameOver) rafId=requestAnimationFrame(loop);
}

function updateStats(){
  $("score").textContent=score.toLocaleString();
  $("bestChain").textContent=bestChain;
  $("level").textContent=level;
}

function renderMini(container,value){
  container.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="mini-cell";
    if(value!==null && i===1){
      d.textContent=value;
      d.style.background=COLORS[value];
      d.style.color="#10131e";
    }else{
      d.textContent="";
    }
    container.appendChild(d);
  }
}

function renderSide(){
  renderMini(holdGrid,hold);
  $("holdStatus").textContent=holdUsed?"HOLD USED":"HOLD AVAILABLE";
  nextList.innerHTML="";
  ensureQueue();
  queue.slice(0,3).forEach((p,i)=>{
    const item=document.createElement("div");
    item.className="next-item";
    const label=document.createElement("div");
    label.className="next-label";
    label.textContent=`NEXT ${i+1}`;
    const grid=document.createElement("div");
    grid.className="mini-grid";
    for(let j=0;j<4;j++){
      const d=document.createElement("div");
      d.className="mini-cell";
      if(j===1){
        d.textContent=p.value;
        d.style.background=COLORS[p.value];
        d.style.color="#10131e";
      }
      grid.appendChild(d);
    }
    item.append(label,grid);
    nextList.appendChild(item);
  });
}

function render(){
  if(!board) return;
  const active=current && !gameOver ? `${current.y},${current.x}`:null;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const el=cells[y][x];
      let v=board[y][x];
      const isActive=active===`${y},${x}`;
      if(isActive) v=current.value;
      el.textContent=v||"";
      el.className="cell";
      el.style.background=v?COLORS[v]:"#1b2031";
      el.style.color=v?"#10131e":"";
      if(v) el.classList.add("filled");
      if(isActive) el.classList.add("active");
    }
  }
  updateStats();
  renderSide();
}

$("startBtn").addEventListener("click",startGame);
$("restartBtn").addEventListener("click",()=>{
  init();
  startGame();
});
$("pauseBtn").addEventListener("click",togglePause);
$("holdBtn").addEventListener("click",holdPiece);
$("leftBtn").addEventListener("click",()=>move(-1,0));
$("rightBtn").addEventListener("click",()=>move(1,0));
$("downBtn").addEventListener("click",()=>{
  if(move(0,1)){
    score+=1;
    updateStats();
  }else if(running && !paused && !gameOver){
    lockPiece();
  }
});
$("rotateBtn").addEventListener("click",rotatePiece);

document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)){
    e.preventDefault();
  }
  if(e.repeat && ["c","C","p","P","ArrowUp"," "].includes(e.key)) return;
  if(e.key==="Enter" && !running && !gameOver) startGame();
  if(e.key==="ArrowLeft") move(-1,0);
  if(e.key==="ArrowRight") move(1,0);
  if(e.key==="ArrowDown"){
    if(move(0,1)){
      score+=1;
      updateStats();
    }else if(running && !paused && !gameOver) lockPiece();
  }
  if(e.key==="ArrowUp") rotatePiece();
  if(e.key===" ") hardDrop();
  if(e.key==="c" || e.key==="C") holdPiece();
  if(e.key==="p" || e.key==="P") togglePause();
});

init();
</script>
</body>
</html>
